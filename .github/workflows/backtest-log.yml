name: Backtest Log
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run backtest logger
        run: node backtest/log-run.mjs
      - name: Check for changes
        id: git_check
        run: |
          if git diff --quiet -- backtest-data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.git_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest-data/predictions.jsonl backtest-data/observations.jsonl
          git commit -m "Backtest log $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
