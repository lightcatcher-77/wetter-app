}

// ── WMO-Wettercodes ──────────────────────────────────────────────────────────
const WMO_MAP = {
  0:["☀️","Klar"],1:["🌤","Überwiegend klar"],2:["⛅","Wechselnd bewölkt"],3:["☁️","Bedeckt"],
  45:["🌫","Nebel"],48:["🌫","Gefrierender Nebel"],
  51:["🌦","Leichter Nieselregen"],53:["🌦","Nieselregen"],55:["🌦","Starker Nieselregen"],
  61:["🌧","Leichter Regen"],63:["🌧","Mäßiger Regen"],65:["🌧","Starker Regen"],
  71:["❄️","Leichter Schneefall"],73:["❄️","Mäßiger Schneefall"],75:["❄️","Starker Schneefall"],
  77:["🌨","Schneekörner"],
  80:["🌦","Leichte Schauer"],81:["🌧","Mäßige Schauer"],82:["🌧","Starke Schauer"],
  85:["🌨","Leichte Schneeschauer"],86:["🌨","Starke Schneeschauer"],
  95:["⛈","Gewitter"],96:["⛈","Gewitter mit Hagel"],99:["⛈","Schweres Gewitter"]
};
function wmoIcon(code){
  const c = Math.round(code||0);
  if (WMO_MAP[c]) return WMO_MAP[c];
  if (c<=2) return ["🌤","Überwiegend klar"];
  if (c<=9) return ["☁️","Bewölkt"];
  if (c<=49) return ["🌫","Nebel"];
  if (c<=59) return ["🌦","Nieselregen"];
  if (c<=69) return ["🌧","Regen"];
  if (c<=79) return ["❄️","Schneefall"];
  if (c<=84) return ["🌧","Schauer"];
  if (c<=89) return ["🌨","Schneeschauer"];
  return ["⛈","Gewitter"];
}
// Bright-Sky-Beobachtung (grobes 'condition'-Feld) auf das bestehende WMO-Icon-Schema abbilden,
// damit Icon/Text/Gewitter-% weiterhin über wmoIcon()/thunderPct() laufen.
function brightSkyToWmoCode(w){
  switch(w.condition){
    case 'thunderstorm': return 95;
    case 'hail': return 96;
    case 'snow': return 73;
    case 'sleet': return 67; // WMO kennt kein reines "Schneeregen", nächstliegend als Regen behandelt
    case 'rain': { const mm=w.precipitation_60??0; return mm>=5?65:mm>=1?63:61; }
    case 'fog': return 45;
    default: { const cc=w.cloud_cover??0; return cc<=20?0:cc<=50?1:cc<=80?2:3; } // 'dry'/unbekannt
  }
}
// Tagescharakter aus Stunden-Codes: Gewitter schlägt alles, Niederschlag ab 2 Stunden,
// Nebel nur wenn er mehr als die Hälfte des Fensters dominiert (sonst zählt er als bedeckt) —
// verhindert, dass Morgennebel einen sonnigen Tag als 🌫 anzeigt (daily.weather_code-Eigenheit).
function modeOf(arr){
  const cnt={};let best=arr[0],bn=0;
  for(const c of arr){cnt[c]=(cnt[c]||0)+1;const n=cnt[c];if(n>bn||(n===bn&&c>best)){bn=n;best=c;}}
  return best;
}
function pickDayCode(codes){
  if(!codes.length) return null;
  const sev=codes.filter(c=>c>=95);
  if(sev.length) return Math.max(...sev);
  const isPrec=c=>(c>=51&&c<=86)||c===77;
  const prec=codes.filter(isPrec);
  if(prec.length>=2) return modeOf(prec);
  const fog=codes.filter(c=>c===45||c===48);
  if(fog.length>codes.length/2) return modeOf(fog);
  const rest=codes.map(c=>(c===45||c===48)?3:c).filter(c=>!isPrec(c));
  return modeOf(rest.length?rest:codes);
}
function thunderPct(code){
  const c = Math.round(code||0);
  if (c>=99) return 90;
  if (c>=96) return 75;
  if (c>=95) return 60;
  return 0;
}
function windDirLbl(deg){
  const dirs=['N','NO','O','SO','S','SW','W','NW'];
  return dirs[Math.round((deg||0)/45)%8];
}
const WD_LBL=['Mo','Di','Mi','Do','Fr','Sa','So'];

// ── Multi-Modell-Konsens ─────────────────────────────────────────────────────
function modelPairs(obj,base,i){
  const out=[];
  for(const m of MODELS){
    const v=obj?.[base+'_'+m]?.[i];
    if(v!=null&&isFinite(v)) out.push([m,v]);
  }
  return out;
}
// Lead-time-abhängige Gewichte: nah dran zählt hochauflösende Regionalmodell-Auflösung mehr,
// ab Tag 3 verliert ICON an Reichweite und ECMWF (bestes Modell im Mittelfrist-Bereich) übernimmt.
// Stand 07.08.2026: ICON-D2 war zuletzt im Nahbereich bei Regen wiederholt unzuverlässiger als
// die IFS-Modelle — ICON-Gewicht dort reduziert. meteoswiss_icon_ch1 (1km, Alpenraum) liefert nur
// für die ersten ~33h Daten und zählt daher nur in W_NEAR nennenswert mit; darüber hinaus fehlt der
// Wert einfach (weightedMedian ignoriert fehlende Modelle), das Gewicht in W_FAR ist dann irrelevant.
const W_NEAR = { icon_seamless:0.25, meteoswiss_icon_ch1:0.20, ecmwf_ifs:0.25, gfs_seamless:0.15, meteofrance_seamless:0.15 }; // 0-48h
const W_FAR  = { icon_seamless:0.15, meteoswiss_icon_ch1:0.05, ecmwf_ifs:0.50, gfs_seamless:0.20, meteofrance_seamless:0.15 }; // >48h
function weightsForHour(hoursAhead){ return hoursAhead<=48 ? W_NEAR : W_FAR; }
function weightsForDay(dayIndex){ return dayIndex<=1 ? W_NEAR : W_FAR; }
function weightedMedian(pairs, weights){
  const items = pairs.filter(([,v])=>v!=null&&isFinite(v)).map(([m,v])=>({v,w:weights[m]??0.25}));
  if(!items.length) return null;
  items.sort((a,b)=>a.v-b.v);
  const total = items.reduce((s,it)=>s+it.w,0);
  let cum=0;
  for(const it of items){ cum+=it.w; if(cum>=total/2) return it.v; }
  return items[items.length-1].v;
}
// Ensemble → Regenwahrscheinlichkeit: Anteil der Member mit ≥0,1 mm in der Stunde.
// Liefert {isoZeit: prozent} oder null, wenn die Ensemble-Antwort unbrauchbar ist.
function buildEnsRain(rawE){
  if(!rawE||!rawE.hourly||!rawE.hourly.time) return null;
  const h=rawE.hourly;
  const members=Object.keys(h).filter(k=>k.indexOf('precipitation')===0);
  if(members.length<10) return null;
  const map={};
  h.time.forEach((t,i)=>{
    let wet=0,n=0;
    for(const m of members){const v=h[m][i];if(v!=null){n++;if(v>=0.1)wet++;}}
    if(n>0) map[t]=Math.round(100*wet/n);
  });
  map.__members=members.length;
  return map;
}
// Icon ↔ Regenrisiko abgleichen: trockenes Icon bei hohem Risiko anheben,
// Regen-Icon bei sehr geringem Risiko absenken (Gewitter bleibt unangetastet)
function reconcileCode(code,rainPct){
  if(code==null||rainPct==null) return code;
  const dry=code<=48;
  if(rainPct>=50&&dry) return 80;
  if(rainPct<15&&!dry&&code<95) return 3;
  return code;
}

// Wandelt die Open-Meteo-Antworten in das Anzeigeformat um.
// raw = best_match-Abruf (alle Variablen), rawM = Multi-Modell-Abruf (optional),
// ensRain = Stunden-Regenwahrscheinlichkeit aus dem ICON-EPS-Ensemble (optional).
function buildWeatherData(raw, rawM, ensRain, satSky, bs){
  const satClear = satSky && satSky.clear;
  const satCloudy = satSky && satSky.cloudy;
  const cur = raw.current;
  const sunrise = raw.daily.sunrise[0].slice(11,16);
  const sunset = raw.daily.sunset[0].slice(11,16);

  // Index-Maps für den Multi-Modell-Abruf (Zeitachsen können theoretisch abweichen)
  const mDayIdx = {}, mHourIdx = {};
  if (rawM && rawM.daily && rawM.hourly) {
    rawM.daily.time.forEach((t,i)=>mDayIdx[t]=i);
    rawM.hourly.time.forEach((t,i)=>mHourIdx[t]=i);
  }
  const activeModels = rawM ? MODELS.filter(m=>rawM.daily?.['temperature_2m_max_'+m]?.some(v=>v!=null)) : [];

  const nowIsoT = cur.time;
  const htimes = raw.hourly.time;
  let si = htimes.findIndex(t=>t>=nowIsoT);
  if (si<0) si=0;
  // si zeigt per findIndex(>=) auf die nächste volle Stunde, sobald cur.time (mit Minuten)
  // zwischen zwei Stundenwerten liegt — für die laufende Stunde (Jetzt-Code unten) muss aber
  // die bereits begonnene Stunde herangezogen werden, sonst zeigt "Jetzt" schon die Prognose
  // der kommenden Stunde (z.B. "nach dem Schauer/Gewitter", obwohl der laut Stundencode der
  // aktuellen Stunde gerade noch läuft — live beobachtet als Diskrepanz zur Realität).
  let nowHi = si;
  if (nowHi>0 && htimes[nowHi]>nowIsoT) nowHi--;

  // "Jetzt"-Code: ICON statt best_match, da laut Gewichtungsschema (siehe W_NEAR) im
  // Nahbereich wegen der ICON-D2-Auflösung am verlässlichsten — best_match kann bei
  // durchbrochener Bewölkung von der real beobachteten Lage abweichen.
  const iconMi = mHourIdx[htimes[nowHi]];
  const iconNowCode = (iconMi!=null && rawM.hourly.weather_code_icon_seamless)
    ? rawM.hourly.weather_code_icon_seamless[iconMi] : null;
  let nowCode = iconNowCode!=null ? iconNowCode : cur.weather_code;
  // Innerhalb Deutschlands: echte Beobachtung der nächsten DWD-Station (Bright Sky) statt
  // Modell-Schätzung für "Jetzt" — ersetzt die Modell-Schätzung, da bereits real gemessen.
  let station = {source:'openmeteo'};
  if (bs && bs.weather && bs.weather.temperature!=null) {
    // Bright Sky liefert 'condition' pro Feld einzeln aus der nächsten Station, die dieses Feld
    // gerade meldet — meldet die Nahstation kein 'condition', fällt Bright Sky dafür auf eine
    // andere, teils weit entfernte Station zurück (live beobachtet: Füssen fiel auf die
    // Zugspitze-Gipfelstation, 27km entfernt/2150m höher, zurück → "Nebel" am Gipfel wurde als
    // Wetter im Tal angezeigt, obwohl es dort tatsächlich regnete). fallback_source_ids nennt das
    // Feld, wenn es zurückgefallen ist — dann lieber beim Modell-Code bleiben statt einer
    // Beobachtung zu vertrauen, die nicht vom Standort stammt.
    const condIsFallback = !!(bs.weather.fallback_source_ids && bs.weather.fallback_source_ids.condition);
    if (!condIsFallback) nowCode = brightSkyToWmoCode(bs.weather);
    const src = (bs.sources||[]).find(s=>s.id===bs.weather.source_id);
    if (src) station = {source:'brightsky', name:src.station_name, distanceKm: Math.round(src.distance/100)/10};
  }
  // Satelliten-Override, beide Richtungen — bewusst NACH der Stations-Zuweisung oben: die
  // Station kann mehrere km entfernt liegen (siehe station.distanceKm) und dort lokal anders
  // liegen, der Satellit ist am exakten Standort verlässlicher. Lief die "klar"-Richtung vor der
  // Stations-Zuweisung (wie ursprünglich), überschrieb die Station sie wieder — dann griff der
  // Override in Deutschland (wo fast immer eine Bright-Sky-Station in der Nähe ist) faktisch nie.
  // Modell/Station melden "wechselnd bewölkt/bedeckt" (2/3, kein Niederschlag), Satellit zeigt
  // aber keinen kalten Wolkenschirm über dem exakten Standort → als klar werten. Nur in dieser
  // Richtung und nie bei Regen-/Gewittercodes.
  if (satClear && (nowCode===2 || nowCode===3)) nowCode = 0;
  // Gegenrichtung: Station/Modell melden klar (0/1), aber der Satellit zeigt eindeutig einen
  // kalten/hohen Wolkenschirm über dem exakten Standort. "Bedeckt" (3) statt z.B. "wechselnd
  // bewölkt", da sich Bewölkungsgrad aus einem Graustufen-Pixel nicht feiner unterscheiden lässt
  // — derselbe generische Cloudy-Fallback-Code wie in reconcileCode() weiter unten.
  if (satCloudy && (nowCode===0 || nowCode===1)) nowCode = 3;
  const [icoRaw,cond] = wmoIcon(nowCode);
  // Nachts nie ein Sonnen-Icon zeigen, auch bei klarem/leicht bewölktem Himmel — dann Mond statt Sonne.
  const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m;};
  const nowMin=toMin(cur.time.slice(11,16));
  const isNightNow=nowMin<toMin(sunrise)||nowMin>=toMin(sunset);
  const ico=(isNightNow&&['☀️','🌤','⛅'].includes(icoRaw))?'🌙':icoRaw;

  const bsUsed = station.source==='brightsky';
  const current = {
    temp: bsUsed ? Math.round(bs.weather.temperature) : Math.round(cur.temperature_2m),
    feelsLike: Math.round(cur.apparent_temperature),
    icon: ico, condition: cond, weatherCode: nowCode,
    wind: bsUsed ? Math.round(bs.weather.wind_speed_10) : Math.round(cur.wind_speed_10m),
    windDir: windDirLbl(bsUsed ? bs.weather.wind_direction_10 : cur.wind_direction_10m),
    rain_pct: raw.daily.precipitation_probability_max[0] || 0,
    thunder_pct: thunderPct(nowCode),
    humidity: bsUsed ? Math.round(bs.weather.relative_humidity) : Math.round(cur.relative_humidity_2m),
    uv: Math.round(cur.uv_index || 0),
    sunrise, sunset, station
  };

  const hourly24=[];
  for(let i=0;i<24;i++){
    const idx=si+i;
    if(idx>=htimes.length) break;
    const t=htimes[idx];
    const [ic] = wmoIcon(raw.hourly.weather_code[idx]);
    let temp = raw.hourly.temperature_2m[idx];
    let rain = raw.hourly.precipitation_probability[idx] || 0;
    const mi = mHourIdx[t];
    let hModelVals = {};
    if (mi!=null) {
      const w = weightsForHour(i);
      const tp = modelPairs(rawM.hourly,'temperature_2m',mi);
      if (tp.length>=2) temp = weightedMedian(tp,w);
      const rp = modelPairs(rawM.hourly,'precipitation_probability',mi);
      if (rp.length>=2) rain = weightedMedian(rp,w);
      // Einzelwerte je Modell für die Multi-Modell-Punkte in der Stundenkarte (siehe makeHourly).
      rp.forEach(([m,v])=>{ hModelVals[m] = Math.round(v); });
    }
    if (ensRain && ensRain[t]!=null) rain = ensRain[t];
    hourly24.push({
      iso:t, h:parseInt(t.slice(11,13)), time:t.slice(11,16),
      temp:Math.round(temp),
      rain:Math.round(rain),
      rainMm:Math.round((raw.hourly.precipitation[idx]||0)*10)/10,
      thunder: thunderPct(raw.hourly.weather_code[idx]),
      snow:0, wind:Math.round(raw.hourly.wind_speed_10m[idx]), icon:ic,
      modelVals: hModelVals
    });
  }

  // Stunden-Indizes pro Kalendertag (für Tagescharakter + Morgens/Mittags/Abends)
  const dayHours={};
  htimes.forEach((t,idx)=>{const ds=t.slice(0,10);(dayHours[ds]=dayHours[ds]||[]).push(idx);});
  const hourAt=ix=>+htimes[ix].slice(11,13);
  // Stundenwert mit Multi-Modell-Median (falls verfügbar)
  function hConsensus(ix,base,fallback){
    const mi2=mHourIdx[htimes[ix]];
    if(mi2!=null){
      const pairs=modelPairs(rawM.hourly,base,mi2);
      if(pairs.length>=2) return weightedMedian(pairs, weightsForHour(ix-si));
    }
    return fallback;
  }

  const forecast=[];
  raw.daily.time.forEach((ds,i)=>{
    const dt=new Date(ds+'T00:00:00');
    const hIdxs=dayHours[ds]||[];
    // Tages-Icon aus dem Fenster 9–18 Uhr statt daily.weather_code (Morgennebel-Problem)
    const dayCodes=hIdxs.filter(ix=>hourAt(ix)>=9&&hourAt(ix)<=18).map(ix=>raw.hourly.weather_code[ix]);
    const dCode0=pickDayCode(dayCodes);
    const thunderDay=hIdxs.length
      ? Math.max(...hIdxs.map(ix=>thunderPct(raw.hourly.weather_code[ix])))
      : thunderPct(raw.daily.weather_code[i]);
    // Tagesabschnitte
    const parts=[['Morgens',6,11],['Mittags',12,17],['Abends',18,23]].map(([lbl,h1,h2])=>{
      const ixs=hIdxs.filter(ix=>hourAt(ix)>=h1&&hourAt(ix)<=h2);
      if(!ixs.length) return null;
      const codes=ixs.map(ix=>raw.hourly.weather_code[ix]);
      const temps=ixs.map(ix=>hConsensus(ix,'temperature_2m',raw.hourly.temperature_2m[ix]));
      const rains=ixs.map(ix=>hConsensus(ix,'precipitation_probability',raw.hourly.precipitation_probability[ix]||0));
      const ensSeg=ixs.map(ix=>ensRain?ensRain[htimes[ix]]:null).filter(v=>v!=null);
      const segRain=ensSeg.length?Math.max(...ensSeg):Math.round(Math.max(...rains));
      const [pic,pco]=wmoIcon(reconcileCode(pickDayCode(codes),segRain));
      const winds=ixs.map(ix=>raw.hourly.wind_speed_10m[ix]||0);
      const segRainMm=Math.round(ixs.reduce((s,ix)=>s+(raw.hourly.precipitation[ix]||0),0)*10)/10;
      return {lbl,icon:pic,cond:pco,
        tmin:Math.round(Math.min(...temps)),tmax:Math.round(Math.max(...temps)),
        rain:segRain,rainMm:segRainMm,wind:Math.round(Math.max(...winds)),
        thunder:Math.max(...codes.map(thunderPct))};
    }).filter(Boolean);
    const dy=ds.slice(8,10), mo=ds.slice(5,7);
    const sunH=Math.round((raw.daily.sunshine_duration[i]||0)/360)/10;
    let tmax = raw.daily.temperature_2m_max[i];
    let tmin = raw.daily.temperature_2m_min[i];
    let rain = raw.daily.precipitation_probability_max[i] || 0;
    let spread = 0, mdetail = '', modelVals = {};
    let rainModelWeighted = null, rainSpread = 0;
    const mi = mDayIdx[ds];
    if (mi!=null) {
      const w = weightsForDay(i);
      const pMax = modelPairs(rawM.daily,'temperature_2m_max',mi);
      const pMin = modelPairs(rawM.daily,'temperature_2m_min',mi);
      const pRain = modelPairs(rawM.daily,'precipitation_probability_max',mi);
      const pMm = modelPairs(rawM.daily,'precipitation_sum',mi);
      const pCode = modelPairs(rawM.daily,'weather_code',mi);
      if (pMax.length>=2) {
        const vals=pMax.map(p=>p[1]);
        tmax = weightedMedian(pMax,w);
        spread = Math.round(Math.max(...vals)-Math.min(...vals));
        mdetail = pMax.map(([m,v])=>`${MODEL_LBL[m]} ${Math.round(v)}°`).join(' · ');
      }
      if (pMin.length>=2) tmin = weightedMedian(pMin,w);
      if (pRain.length>=2) {
        rain = weightedMedian(pRain,w);
        rainModelWeighted = Math.round(rain);
        const rvals=pRain.map(p=>p[1]);
        rainSpread = Math.round(Math.max(...rvals)-Math.min(...rvals));
      }
      // Einzelwerte je Modell für Temperaturchart & Modellvergleich (Max, Min, Regen%, mm, Icon)
      pMax.forEach(([m,v])=>{ modelVals[m]=modelVals[m]||{}; modelVals[m].max=Math.round(v); });
      pMin.forEach(([m,v])=>{ modelVals[m]=modelVals[m]||{}; modelVals[m].min=Math.round(v); });
      pRain.forEach(([m,v])=>{ modelVals[m]=modelVals[m]||{}; modelVals[m].rain=Math.round(v); });
      pMm.forEach(([m,v])=>{ modelVals[m]=modelVals[m]||{}; modelVals[m].mm=Math.round(v*10)/10; });
      pCode.forEach(([m,v])=>{
        modelVals[m]=modelVals[m]||{};
        const mRain = modelVals[m].rain!=null ? modelVals[m].rain : rain;
        const [mic,mco] = wmoIcon(reconcileCode(v, mRain));
        modelVals[m].icon = mic; modelVals[m].cond = mco;
      });
    }
    // Ensemble schlägt Modell-Median beim Regenrisiko (Tagesmaximum der Stundenwerte)
    const ensDay=hIdxs.map(ix=>ensRain?ensRain[htimes[ix]]:null).filter(v=>v!=null);
    if (ensDay.length>=12) rain=Math.max(...ensDay);
    const [ic,co]=wmoIcon(reconcileCode(dCode0!=null?dCode0:raw.daily.weather_code[i], rain));
    forecast.push({
      date:`${dy}.${mo}`, wd:WD_LBL[(dt.getDay()+6)%7],
      icon:ic, max:Math.round(tmax),
      min:Math.round(tmin), cond:co,
      rain:Math.round(rain),
      rainMm: Math.round((raw.daily.precipitation_sum[i]||0)*10)/10,
      thunder: thunderDay,
      snow:0, sun:sunH,
      wind: Math.round(raw.daily.wind_speed_10m_max[i] || 0),
      spread, mdetail, parts, modelVals, rainModelWeighted, rainSpread
    });
  });

  const now = new Date();
  const pad=n=>String(n).padStart(2,'0');
  if (forecast.length) current.rain_pct = forecast[0].rain;
  return {
    current, warning:null, hourly24, forecast,
    meta:{
      source: (activeModels.length>1
        ? `Konsens aus ${activeModels.length} Modellen: ${activeModels.map(m=>MODEL_LBL[m]).join(' · ')}`
        : 'Open-Meteo best match')
        + (ensRain?` · Regenrisiko: ICON-EPS-Ensemble (${ensRain.__members} Member)`:''),
      nModels: activeModels.length,
      utcOffset: raw.utc_offset_seconds,
      ts:`${pad(now.getDate())}.${pad(now.getMonth()+1)}.${now.getFullYear()}`,
      ts_time:`${pad(now.getHours())}:${pad(now.getMinutes())}`,
      fetched_iso: now.toISOString().slice(0,16)
    }
  };
}

// ── Standort ─────────────────────────────────────────────────────────────────
function getPosition(){
  return new Promise(res=>{
    if(!('geolocation' in navigator)) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lon:p.coords.longitude}),
      ()=>res(null),
      {enableHighAccuracy:false, timeout:8000, maximumAge:600000}
    );
  });
}
async function fetchLocationName(lat,lon){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=de`);
    if(!r.ok) return null;
    const j=await r.json();
    return {name:j.city||j.locality||j.principalSubdivision||null, region:j.principalSubdivision||''};
  }catch(e){return null;}
}

// ── Wetterwarnungen: DWD (via Bright Sky) + GeoSphere Österreich ─────────────
async function fetchWarnings(lat,lon){
  const out=[];
  try{
    const r=await fetch(`https://api.brightsky.dev/alerts?lat=${lat}&lon=${lon}`);
    if(r.ok){
      const j=await r.json();
      (j.alerts||[]).forEach(a=>out.push({
        title:a.headline_de||a.event_de||'Wetterwarnung (DWD)',
        text:(a.description_de||'').slice(0,300),
        severity:(a.severity==='severe'||a.severity==='extreme')?'danger':'info'
      }));
    }
  }catch(e){}
  // Österreich (grobe Bounding Box) zusätzlich über GeoSphere/ZAMG
  if(lat>=46.3&&lat<=49.1&&lon>=9.5&&lon<=17.2){
    try{
      const r=await fetch(`https://warnungen.zamg.at/wsapp/api/getWarningsForCoords?lon=${lon}&lat=${lat}&lang=de`);
      if(r.ok){
        const j=await r.json();
        (j?.properties?.warnings||[]).forEach(w=>{
          const p=w.properties||w;
          out.push({
            title:p.text||p.type||'Wetterwarnung (GeoSphere)',
            text:String(p.auswirkungen||p.meteotext||'').slice(0,300),
            severity:(+(p.warnstufeid||p.rawinfo?.wlevel||0)>=3)?'danger':'info'
          });
        });
      }
    }catch(e){}
  }
  return out;
}

// ── Bergwetter (DAV Alpenvereins-Wetterbericht) ──────────────────────────────
// Fester Regionaltext (Allgäuer/Bayerische Alpen West) — macht nur beim Füssen-nahen
// Standort Sinn, deshalb Bounding-Box-Gate wie schon bei den Österreich-Warnungen oben.
function inDavRegion(lat,lon){ return lat>=46.9&&lat<=47.9&&lon>=9.6&&lon<=11.3; }
const DAV_URL='https://www.alpenverein.de/bergwetter/alpen/allgauer-und-bayerische-alpen-west-osterreich-nord';
const JINA_URL='https://r.jina.ai/'; // Lese-Proxy mit offenen CORS-Headern
// Prognosetext aus der Jina-Reader-Ausgabe parsen (Tagesüberschrift + Prognosesatz).
function parseDAV(text){
  if(!text||text.length<50) return null;
  const DAYS='Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag';
  const headRe=new RegExp('(?:Trend ab\\s+)?(?:'+DAYS+'),?\\s*\\d{2}\\.\\d{2}\\.\\d{4}','g');
  const heads=[];
  let m;
  while((m=headRe.exec(text))!==null) heads.push({label:m[0].replace(/^#+\s*/,'').trim(),idx:m.index,end:headRe.lastIndex});
  if(!heads.length) return null;
  const days=[],seen=new Set();
  for(let i=0;i<heads.length;i++){
    const stop=i+1<heads.length?heads[i+1].idx:text.length;
    let chunk=text.slice(heads[i].end,stop);
    let sentence=chunk.split(/Letzte Aktualisierung/)[0].split(/\n\s*\|/)[0];
    sentence=sentence.replace(/[#*_>`]/g,'').replace(/\s+/g,' ').trim();
    const label=heads[i].label;
    if(sentence&&/[a-zäöü]/i.test(sentence)&&sentence.length>=8&&sentence.length<=400&&!sentence.includes('|')&&!seen.has(label)){
      seen.add(label);
      days.push({label,text:sentence});
    }
    if(days.length>=6) break;
  }
  if(!days.length) return null;
  let stand=null;
  const sm=text.match(/Letzte Aktualisierung[^:]*:\s*([\d.]+)\s*um\s*([\d:]+)/);
  if(sm) stand=sm[1].replace(/\.$/,'')+' '+sm[2].slice(0,5)+' Uhr';
  return {live:true,source:'DAV Bergwetter · GeoSphere Austria',region:'Allgäuer und Bayerische Alpen West',stand,days};
}
// Best-effort: liefert null bei Fehlschlag (kein fiktiver Fallback-Text mit veraltetem Datum) —
// die Karte wird dann in render() einfach nicht angezeigt.
async function fetchDAV(){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),8000);
  try{
    const resp=await fetch(JINA_URL+DAV_URL,{headers:{'Accept':'text/plain'},signal:ctrl.signal});
    if(!resp.ok) throw new Error('Jina-Reader Status '+resp.status);
    const parsed=parseDAV(await resp.text());
    return (parsed&&parsed.days&&parsed.days.length)?parsed:null;
  }catch(e){
    console.warn('DAV-Bergwetter nicht verfügbar:',e.message);
    return null;
  }finally{clearTimeout(t);}
}
// Bergwetter-Karte — einklappbar wie Chart/Modellvergleich, nutzt dieselbe Card-Optik.
function renderDavCard(dav){
  if(!dav||!dav.days||!dav.days.length) return '';
  const badge=dav.live?'🟢 Live abgerufen':'🔵 Snapshot';
  const items=dav.days.map(d=>`<div class="dav-day"><span class="dav-day-lbl">${esc(d.label)}</span><span class="dav-day-txt">${esc(d.text)}</span></div>`).join('');
  return `<div class="card model-matrix-card">
    <div class="section-title collapsible" onclick="toggleSection(this,'dav-body')">⛰️ Bergwetter · ${esc(dav.region)}<span class="chevron">▾</span></div>
    <div class="collapse-body" id="dav-body">
      <div class="dav-badge">${badge} · ${esc(dav.source)}</div>
      <div class="dav-days">${items}</div>
      ${dav.stand?`<div class="dav-stand">Wetterdienst-Stand: ${esc(dav.stand)}</div>`:''}
    </div>
  </div>`;
}

// ── Regenradar (RainViewer) + Wolkenradar (EUMETSAT Satellit) ────────────────
// Grobes Deutschland-Gate für die Vorwarnung (dwdRadarCheckIncoming) — der DWD-WMS
// deckt nur Deutschland ab, außerhalb wird auf RainViewer zurückgefallen. Bewusst
// großzügig, Ungenauigkeit an der Grenze ist unkritisch (DWD liefert dort einfach
// leere/transparente Bilder statt eines Fehlers).
function inGermany(lat,lon){ return lat>=47.2&&lat<=55.1&&lon>=5.8&&lon<=15.1; }
let radarMap=null, radarMarker=null;
let radarCanvas=null;     // Canvas-Overlay für die Einzelbild-Quellen (DWD-Regen, Satellit)
let radarTiles=null;      // Kachel-Layer für den RainViewer-Fallback außerhalb Deutschlands
let radarMode='rain'; // 'rain' | 'sat' — steuert nur, welcher Layer/Tab im Kartenbereich aktiv ist
let radarFrames=[], radarPastLen=0, radarIndex=0, radarPlaying=false, radarTimer=null, radarHost='';
let satFrames=[]; // {time} — synthetisiert, RainViewer liefert hierfür keine Frame-Liste
let radarLoc=null, radarSampleSeq=0;
// DWD-WMS-Zeitkacheln für die sichtbare Regenradar-Karte bei deutschen Standorten (echte
// ~2h-Prognose statt RainViewers oft leerem Nowcast) — RainViewer bleibt für Badge/Vorwarnungs-
// Fallback/Wolkenradar weiterhin im Hintergrund aktiv, siehe fetchRadarFrames().
const DWD_WMS='https://maps.dwd.de/geoserver/dwd/wms';
const DWD_LAYER='dwd:Radar_rv_product_1x1km_ger';
const DWD_STEP_MIN=5;
const DWD_PAST_MIN=120, DWD_FUTURE_MIN=120;
// Der jüngste Vorhersage-Zyklus braucht ein paar Minuten Produktionszeit beim DWD, bevor er im
// WMS abrufbar ist (live geprüft: um :52 war der :50-Zyklus — und damit die Zeit "jetzt+120" —
// noch nicht da, erst um :54 doch). Ohne Marge fragt der äußerste +120-Min-Frame regelmäßig eine
// Zeit an, die es serverseitig noch gar nicht gibt (ServiceException statt Bild) und blieb dann
// im "Lädt…"-Zustand hängen. Der äußerste Frame wird deshalb um eine Taktlänge zurückgenommen.
const DWD_PUBLISH_LAG_MIN=5;
let dwdFrames=[], dwdPastLen=0;
function radarUsingDwdForLoc(){ return !!radarLoc && inGermany(radarLoc.lat,radarLoc.lon); }
function activeFrames(){
  if(radarMode==='sat')return satFrames;
  return radarUsingDwdForLoc()?dwdFrames:radarFrames;
}
function activePastLen(){
  if(radarMode==='sat')return satFrames.length;
  return radarUsingDwdForLoc()?dwdPastLen:radarPastLen;
}
function buildDwdFrames(){
  const now=new Date();
  now.setUTCSeconds(0,0);
  now.setUTCMinutes(Math.floor(now.getUTCMinutes()/DWD_STEP_MIN)*DWD_STEP_MIN);
  const steps=[];
  for(let m=-DWD_PAST_MIN;m<=DWD_FUTURE_MIN-DWD_PUBLISH_LAG_MIN;m+=DWD_STEP_MIN)steps.push(m);
  dwdFrames=steps.map(m=>{
    const t=new Date(now.getTime()+m*60000);
    return{time:Math.floor(t.getTime()/1000),iso:t.toISOString()};
  });
  dwdPastLen=steps.filter(m=>m<=0).length;
}
// Baut die sichtbare Kartenanzeige für den Regen-Tab neu auf: DWD für deutsche Standorte
// (sofort, kein Netzwerk-Roundtrip nötig — nur die Zeitachse wird neu berechnet), sonst
// RainViewer aus den bereits geholten Frames. Wird bei Standort- und Tab-Wechsel gerufen.
// Der RainViewer-Zweig ist wichtig beim Wechsel von einem deutschen auf einen ausländischen
// Standort: ohne ihn bliebe das DWD-Bild (Deutschland) über dem neuen Ort liegen.
function refreshRainDisplay(){
  if(radarMode!=='rain'||!radarMap||!radarLoc)return;
  if(!radarUsingDwdForLoc()){
    if(radarFrames.length&&radarHost)showRainViewerDisplay();
    return;
  }
  buildDwdFrames();
  if(!radarViewCovers())radarNewView();
  radarIndex=dwdPastLen-1;
  const slider=document.getElementById('radar-slider');
  slider.max=dwdFrames.length-1;
  slider.value=radarIndex;
  radarBuildTicks();
  radarRenderFrame(radarIndex);
  document.getElementById('radar-note').textContent='Deutsches Radarkomposit (DWD, 1 km, 5-Min-Raster) inkl. echter 2-Std.-Kurzfristprognose (RADVOR).';
  radarPrefetchFrames();
}

// ── Frame-Engine: Bilder im Speicher halten statt sie neu zu laden ───────────
// Warum das nötig ist: der DWD-WMS liefert seine GetMap-Antworten ohne Cache-Control,
// ETag oder Last-Modified (per Live-Test bestätigt) — der Browser darf sie also gar nicht
// wiederverwenden. Ein "Vorladen" per new Image() verpufft damit vollständig: jeder
// Frame-Wechsel beim Scrubben stieß erneut ein serverseitiges Rendern von ~1-1,5 s an,
// und genau das war als Hängen zu spüren. Deshalb hält die App die Frame-Bilder jetzt
// selbst als Image-Objekte im Speicher und zeichnet sie synchron per drawImage auf ein
// Canvas-Overlay: ein bereits geladener Frame erscheint ohne Netzwerk, ohne Flackern und
// ohne Leerframe im selben Repaint wie die Slider-Bewegung.
const RADAR_VIEW_PAD=0.15;   // Rand um den sichtbaren Ausschnitt — kleine Pans ohne Neuladen
const RADAR_MAX_PX=560;      // Deckel für die angeforderte Bildkantenlänge
const RADAR_PARALLEL=6;      // gleichzeitige Bild-Requests (GeoServer rendert live, nicht fluten)
let radarView=null;          // {bbox,w,h,bounds,zoom,sx,sy} — Ausschnitt, für den neu geladen wird
let radarCanvasView=null;    // Ausschnitt des gerade gezeichneten Bildes
const radarImgCache=new Map(); // url -> {url,view,state,img,prio,cbs}
const radarQueue=[], radarInflight=new Set();
let radarLoading=0, radarWantedUrl=null, radarWantTimer=null, radarViewTimer=null;

// Gepolsterte, auf ein grobes Raster gerundete Bbox: kleine Kartenverschiebungen ergeben
// dieselbe Bbox und damit dieselben URLs — der geladene Bildvorrat bleibt gültig, statt beim
// kleinsten Pan komplett zu verfallen. Die Bildkante wird gedeckelt; das Radarprodukt löst
// ohnehin nur 1 km auf, ein größeres Bild kostet nur Renderzeit beim Server.
function radarComputeView(){
  const b=radarMap.getBounds(), s=radarMap.getSize();
  const latSpan=Math.max(b.getNorth()-b.getSouth(),1e-4);
  const lonSpan=Math.max(b.getEast()-b.getWest(),1e-4);
  const gLat=latSpan/10, gLon=lonSpan/10, r=v=>Math.round(v*1e5)/1e5;
  const south=r(Math.floor((b.getSouth()-latSpan*RADAR_VIEW_PAD)/gLat)*gLat);
  const north=r(Math.ceil ((b.getNorth()+latSpan*RADAR_VIEW_PAD)/gLat)*gLat);
  const west =r(Math.floor((b.getWest() -lonSpan*RADAR_VIEW_PAD)/gLon)*gLon);
  const east =r(Math.ceil ((b.getEast() +lonSpan*RADAR_VIEW_PAD)/gLon)*gLon);
  let w=Math.round(s.x*(east-west)/lonSpan), h=Math.round(s.y*(north-south)/latSpan);
  const scale=Math.min(1,RADAR_MAX_PX/Math.max(w,h,1));
  w=Math.max(64,Math.round(w*scale));
  h=Math.max(64,Math.round(h*scale));
  return {bbox:`${west},${south},${east},${north}`,w,h,zoom:radarMap.getZoom(),sx:s.x,sy:s.y,
          bounds:L.latLngBounds([south,west],[north,east])};
}
function radarEnsureView(){
  if(!radarView&&radarMap)radarView=radarComputeView();
  return radarView;
}
// Deckt der geladene Vorrat den sichtbaren Ausschnitt noch ab?
function radarViewCovers(){
  if(!radarView||!radarMap)return false;
  const s=radarMap.getSize();
  return radarView.zoom===radarMap.getZoom()&&radarView.sx===s.x&&radarView.sy===s.y
    &&radarView.bounds.contains(radarMap.getBounds());
}
function radarNewView(){
  if(!radarMap)return;
  radarView=radarComputeView();
  radarImgCache.clear();
  radarQueue.length=0;
  // Laufende Anfragen für den alten Ausschnitt abbrechen — ihre Bilder passen nicht mehr und
  // würden sonst die Slots für den neuen Ausschnitt blockieren.
  for(const e of[...radarInflight])radarAbort(e,false);
}

function radarImgEntry(url){
  let e=radarImgCache.get(url);
  if(!e){e={url,view:radarView,state:'idle',img:null,prio:99,cbs:[],keep:true};radarImgCache.set(url,e);}
  return e;
}
// prio 0 = der Frame, den der Nutzer gerade sehen will; größer = Hintergrund-Vorrat.
// keep=false für RainViewer-Kacheln: die sind regulär cachebar, da genügt der Browser-Cache
// und das decodierte Bild muss nicht zusätzlich im Speicher gehalten werden.
function radarImgLoad(url,prio,cb,keep){
  const e=radarImgEntry(url);
  if(keep===false)e.keep=false;
  if(e.state==='ok'){if(cb)cb(e);return e;}
  if(e.state==='err'){
    if(prio>0)return e;   // fehlgeschlagene Vorrats-Frames nicht endlos wiederholen
    e.state='idle';
  }
  if(cb)e.cbs.push(cb);
  if(prio<e.prio)e.prio=prio;
  if(e.state==='idle'){e.state='queued';radarQueue.push(e);}
  // Der Frame, den der Nutzer sehen will, wartet nicht hinter dem Vorrat: sind alle Slots
  // mit Hintergrund-Ladevorgängen belegt, wird der unwichtigste davon abgebrochen und später
  // neu eingereiht. Ohne das kostet ein Sprung auf einen noch nicht geladenen Frame beim
  // kalten Start bis zu einer kompletten zusätzlichen Serverantwort extra.
  if(prio===0&&e.state==='queued'&&radarLoading>=RADAR_PARALLEL)radarAbortLowest();
  radarPump();
  return e;
}
function radarAbort(e,requeue){
  const img=e._img;
  if(img){img.onload=img.onerror=null;img.src='';}   // bricht die laufende Anfrage ab
  radarInflight.delete(e);
  radarLoading--;
  e._img=null;
  if(requeue){
    e.state='queued';
    e.prio=Math.max(e.prio,50);                      // hinten wieder einreihen, Callbacks bleiben
    radarQueue.push(e);
  }else{
    e.state='idle';e.cbs=[];
  }
}
function radarAbortLowest(){
  let worst=null;
  for(const e of radarInflight)if(e.prio>0&&(!worst||e.prio>worst.prio))worst=e;
  if(worst)radarAbort(worst,true);
}
function radarPump(){
  while(radarLoading<RADAR_PARALLEL&&radarQueue.length){
    radarQueue.sort((a,b)=>a.prio-b.prio);
    const e=radarQueue.shift();
    e.state='loading';radarLoading++;radarInflight.add(e);
    const img=e._img=new Image();
    const done=()=>{radarInflight.delete(e);e._img=null;radarLoading--;};
    img.onload=()=>{
      done();
      e.state='ok';e.img=e.keep?img:null;
      const cbs=e.cbs;e.cbs=[];
      cbs.forEach(f=>f(e));
      radarPump();
    };
    img.onerror=()=>{
      done();
      e.state='err';
      // Callbacks auch bei Fehlern aufrufen (nicht nur bei Erfolg): radarPaint() schaltet
      // darüber den Ladezustand ab. Ohne das blieb der Frame nach einem Fehlschlag (z. B. eine
      // noch nicht vom DWD veröffentlichte Vorhersagezeit) dauerhaft im "Lädt…"-Zustand hängen.
      const cbs=e.cbs;e.cbs=[];
      cbs.forEach(f=>f(e));
      radarPump();
    };
    img.src=e.url;
  }
}
// Wartende Vorrats-Requests nach Abstand zum angezeigten Frame neu einsortieren: was beim
// Weiterscrubben als Nächstes erreicht wird, kommt vor dem Rest an die Reihe.
function radarPrioritize(center){
  const f=activeFrames();
  for(let i=0;i<f.length;i++){
    const e=radarImgCache.get(radarOverlayUrl(f[i]));
    if(e&&e.state==='queued')e.prio=Math.min(e.prio,1+Math.abs(i-center));
  }
}
// Trifft die Anzeige auf eine Einzelbild-Quelle (DWD-Regen oder Satellit) oder auf die
// RainViewer-Kacheln?
function radarOverlayMode(){ return radarMode==='sat'||radarUsingDwdForLoc(); }
function radarFrameIso(frame){
  return frame.iso||new Date(frame.time*1000).toISOString().replace(/\.\d{3}Z$/,'Z');
}
function radarOverlayUrl(frame){
  const iso=radarFrameIso(frame);
  return radarMode==='sat'?satOverlayUrl(iso):dwdOverlayUrl(iso);
}
function radarPrefetchFrames(){
  if(!radarMap||!radarOverlayMode()||!radarEnsureView())return;
  const f=activeFrames();
  const center=Math.min(Math.max(radarIndex,0),Math.max(f.length-1,0));
  f.forEach((fr,i)=>radarImgLoad(radarOverlayUrl(fr),1+Math.abs(i-center)));
  // Ohne eigenes Prefetching wurde der Blitzdichte-Overlay erst beim tatsächlichen Erreichen
  // eines Frames angefordert — spürbar langsamer als der Regen-Layer, der hier schon im
  // Hintergrund vorlädt (~1-1.5s GeoServer-Renderzeit pro Frame beim Scrubben gefühlt). Läuft
  // jetzt mit derselben Priorität mit, damit im Regen-Tab beide Layer gemeinsam aus dem
  // Speicher kommen. Nur Vergangenheits-Frames (dwdPastLen) — für Prognose-Frames gibt es keine
  // Blitzdaten (siehe radarSyncThunderOverlay).
  if(radarMode==='rain'&&radarUsingDwdForLoc())
    for(let i=0;i<dwdPastLen;i++)
      radarImgLoad(thunderOverlayUrl(radarFrameIso(dwdFrames[thunderFrameIdx(i)])),1+Math.abs(i-center));
}
// RainViewer-Fallback: Kacheln kommen von einem CDN und sind — anders als der DWD-WMS —
// regulär cachebar. Hier reicht es, die sichtbaren Kacheln aller Frames einmal anzufordern,
// damit der Layerwechsel beim Scrubben aus dem Browser-Cache bedient wird.
function radarPrefetchTiles(){
  if(!radarMap||!radarHost||!radarFrames.length)return;
  // Der Kachel-Pfad legt nur Buchführungs-Einträge an (keep:false, kein Bild im Speicher) —
  // bei ausgiebigem Pannen/Zoomen sammeln die sich sonst unbegrenzt an.
  if(radarImgCache.size>600)
    for(const[k,e]of radarImgCache)if(!e.keep&&(e.state==='ok'||e.state==='err'))radarImgCache.delete(k);
  const z=Math.min(radarMap.getZoom(),12), b=radarMap.getBounds();
  const nw=radarTileCoords(b.getNorth(),b.getWest(),z), se=radarTileCoords(b.getSouth(),b.getEast(),z);
  const center=radarPastLen-1;
  radarFrames.forEach((fr,i)=>{
    for(let x=nw.tx;x<=se.tx;x++)for(let y=nw.ty;y<=se.ty;y++)
      radarImgLoad(`${radarHost}${fr.path}/256/${z}/${x}/${y}/2/1_1.png`,1+Math.abs(i-center),null,false);
  });
}

// Wie L.imageOverlay, nur mit einem Canvas als Bildfläche: ein Framewechsel ist damit ein
// synchrones drawImage aus dem Speicher statt eines img.src-Wechsels, der erst nach einem
// Netzwerk-Roundtrip (und mit sichtbarem Leerframe dazwischen) ankommt. Positionierung,
// Zoom-Animation und Bounds erledigt weiterhin Leaflet — überschrieben wird nur, woraus
// die Bildfläche besteht. Lazy definiert, weil Leaflet fehlen kann (siehe initRadar).
let RadarCanvasOverlay=null;
function radarCanvasClass(){
  if(RadarCanvasOverlay)return RadarCanvasOverlay;
  RadarCanvasOverlay=L.ImageOverlay.extend({
    _initImage:function(){
      const c=this._image=document.createElement('canvas');
      c.className='leaflet-image-layer'+(this._zoomAnimated?' leaflet-zoom-animated':'');
      c.style.opacity=this.options.opacity;
      c.onselectstart=()=>false;
      c.onmousemove=()=>false;
      if(this.options.zIndex)this._updateZIndex();
    },
    drawFrame:function(img){
      const c=this._image;
      if(!c||!img)return;
      const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w||!h)return;
      if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
      const ctx=c.getContext('2d');
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(img,0,0);
    }
  });
  return RadarCanvasOverlay;
}
function radarEnsureCanvas(opacity){
  if(radarTiles){radarMap.removeLayer(radarTiles);radarTiles=null;}
  if(!radarCanvas){
    radarCanvas=new (radarCanvasClass())('',radarEnsureView().bounds,{opacity,zIndex:400});
    radarCanvas.addTo(radarMap);
    radarCanvasView=null;
  }
  if(radarCanvas.options.opacity!==opacity)radarCanvas.setOpacity(opacity);
  return radarCanvas;
}
function radarSetLoading(on){
  const el=document.getElementById('radar-time');
  if(el)el.classList.toggle('loading',!!on);
}
// Die Bounds werden erst zusammen mit dem passenden Bild gesetzt: solange das Bild für einen
// neuen Ausschnitt noch lädt, bleibt das alte an seiner echten geografischen Position stehen,
// statt auf den neuen Ausschnitt verzerrt zu werden.
function radarPaint(e){
  radarSetLoading(false);
  if(!radarCanvas||!e.img)return;
  if(e.view&&radarCanvasView!==e.view){radarCanvas.setBounds(e.view.bounds);radarCanvasView=e.view;}
  radarCanvas.drawFrame(e.img);
}
function radarShowOverlayFrame(i){
  const frame=activeFrames()[i];
  if(!frame)return;
  radarEnsureView();
  radarEnsureCanvas(radarMode==='sat'?.85:.75);
  const url=radarOverlayUrl(frame);
  radarWantedUrl=url;
  const cached=radarImgCache.get(url);
  if(cached&&cached.state==='ok'&&cached.img){radarPaint(cached);return;}
  radarSetLoading(true);
  // Beim Ziehen des Sliders nicht für jeden Zwischenwert einen WMS-Request auslösen: gecachte
  // Frames sind oben schon synchron gezeichnet, ungecachte werden erst angefordert, wenn der
  // Finger kurz stehen bleibt. Ohne das würde eine einzige Wischbewegung Dutzende Live-
  // Renderings beim Server anstoßen, die sich gegenseitig ausbremsen. Die alte Anzeige bleibt
  // solange stehen — nichts wird geleert, deshalb flackert auch nichts.
  clearTimeout(radarWantTimer);
  radarWantTimer=setTimeout(()=>{
    if(radarWantedUrl!==url)return;
    radarPrioritize(i);
    radarImgLoad(url,0,e=>{ if(radarWantedUrl===e.url)radarPaint(e); });
  },70);
}
function radarShowTileFrame(frame){
  if(radarCanvas){radarMap.removeLayer(radarCanvas);radarCanvas=null;radarCanvasView=null;}
  radarSetLoading(false);
  const url=`${radarHost}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
  if(radarTiles)radarTiles.setUrl(url);
  else radarTiles=L.tileLayer(url,{opacity:.75,maxNativeZoom:12,zIndex:400}).addTo(radarMap);
}
// Nach Pan/Zoom: nur wenn der sichtbare Ausschnitt aus der vorgeladenen Bbox herausgelaufen
// ist, wird ein neuer Vorrat aufgebaut. Innerhalb der Polsterung passiert gar nichts mehr —
// vorher löste jede Kartenbewegung einen kompletten Neuabruf des angezeigten Frames aus.
function radarViewChanged(){
  if(!radarMap)return;
  if(!radarOverlayMode()){radarPrefetchTiles();return;}
  if(radarViewCovers())return;
  radarNewView();
  radarRenderFrame(radarIndex);
  radarPrefetchFrames();
}

function initRadar(){
  if(typeof L==='undefined'||radarMap)return;
  radarMap=L.map('radar-map',{attributionControl:true,zoomControl:true,scrollWheelZoom:false})
    .setView([FALLBACK.lat,FALLBACK.lon],9);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{
    subdomains:'abcd',maxZoom:19,zIndex:1,attribution:'© OpenStreetMap, © CARTO'
  }).addTo(radarMap);
  // Eigene Beschriftungs-Ebene ganz oben (hoher zIndex) — Ortsnamen bleiben so auch unter
  // einer hellen Regen-/Wolkenebene lesbar, statt darunter im Kartenhintergrund zu verschwinden.
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{
    subdomains:'abcd',maxZoom:19,zIndex:650
  }).addTo(radarMap);
  radarMarker=L.circleMarker([FALLBACK.lat,FALLBACK.lon],{radius:6,color:'#f5c842',weight:2,fillColor:'#f5c842',fillOpacity:.9,pane:'markerPane'}).addTo(radarMap);
  radarLoc={lat:FALLBACK.lat,lon:FALLBACK.lon};
  // Satelliten- und DWD-Regenbild sind Einzelbild-Overlays (kein Kachelraster) — läuft die
  // Karte aus dem vorgeladenen Ausschnitt heraus, muss der Bildvorrat neu aufgebaut werden.
  // Entprellt, damit eine Wisch- oder Pinch-Geste das nicht mehrfach anstößt.
  radarMap.on('moveend zoomend resize',()=>{
    clearTimeout(radarViewTimer);
    radarViewTimer=setTimeout(radarViewChanged,180);
  });
  fetchRadarFrames();
  refreshRainDisplay();
}
function radarSetCenter(lat,lon){
  if(!radarMap)return;
  radarMap.setView([lat,lon],radarMap.getZoom()||9);
  if(radarMarker)radarMarker.setLatLng([lat,lon]);
  radarLoc={lat,lon};
  refreshRainDisplay();
  radarSampleAtLocation();
}
function radarJumpToLocation(){
  if(!shownLoc)return;
  radarSetCenter(shownLoc.lat,shownLoc.lon);
}
function radarTileCoords(lat,lon,z){
  const n=Math.pow(2,z);
  const x=(lon+180)/360*n;
  const rad=lat*Math.PI/180;
  const y=(1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n;
  return{tx:Math.floor(x),ty:Math.floor(y),px:Math.floor((x-Math.floor(x))*256),py:Math.floor((y-Math.floor(y))*256)};
}
function radarClassifyPixel(d){
  const[r,g,b,a]=d;
  if(a<25)return null;
  if(r>150&&g<150)return{level:'stark',label:'kräftiger Regen'};
  if(g>140&&b<150)return{level:'mittel',label:'mäßiger Regen'};
  return{level:'leicht',label:'leichter Regen'};
}
// Eigenes Icon für alle Radar-Textmeldungen (Flag-Chip, Dauer-Hinweis, "Regen nähert sich"-Box) —
// bewusst nicht 📡, das ist im Hero schon für die Bright-Sky-Stationsangabe vergeben (siehe
// cur.station-Zeile); sonst tauchen zwei 📡 gleichzeitig im Hero auf.
const RADAR_INFO_ICON='📶';
// Ob der Radar-Punkt-Check gerade Regen am Standort meldet — hält radarCheckIncoming davon ab,
// zusätzlich zur Flag-Chip noch eine "Regen nähert sich"-Box einzublenden, wenn es laut Radar
// bereits regnet (sonst zwei sich widersprechende Meldungen gleichzeitig im Hero).
let radarRainingNow=false;
function radarSetFlag(info){
  radarRainingNow=!!info;
  const el=document.getElementById('radar-flag');
  if(!el)return;
  if(!info){
    if(modelExpectsRain){
      el.style.display='inline-flex';
      el.textContent=`${RADAR_INFO_ICON} Laut Radar: Kein Regen`;
      el.className='radar-flag keins';
    }else{
      el.style.display='none';
      el.className='radar-flag';
    }
    return;
  }
  el.style.display='inline-flex';
  el.textContent=`${RADAR_INFO_ICON} Laut Radar: ${info.label}`;
  el.className='radar-flag '+info.level;
}
// Lädt ein Radar-Tile für den angegebenen Frame-Index und klassifiziert den Pixel an loc.
// Eigene Canvas pro Aufruf statt einer geteilten Instanz — wird u.a. mit mehreren Nowcast-Frames
// parallel aufgerufen (radarCheckIncoming), eine geteilte Canvas würde dort Race Conditions erzeugen.
function radarClassifyFrameAtLoc(frameIdx,loc){
  return new Promise(resolve=>{
    const frame=radarFrames[frameIdx];
    if(!loc||!frame||!radarHost){resolve(null);return;}
    const z=7;
    const{tx,ty,px,py}=radarTileCoords(loc.lat,loc.lon,z);
    const url=`${radarHost}${frame.path}/256/${z}/${tx}/${ty}/2/1_1.png`;
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const canvas=document.createElement('canvas');
        canvas.width=256;canvas.height=256;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        resolve(radarClassifyPixel(ctx.getImageData(px,py,1,1).data));
      }catch(e){resolve(null);}
    };
    img.onerror=()=>resolve(null);
    img.src=url;
  });
}
// Analog zu dwdClassifyAreaAtTime, aber für den RainViewer-Fallback außerhalb Deutschlands
// (radarCheckIncoming): sampelt einen kleinen Block um den Standort statt eines Einzelpixels
// und verlangt via largestConnectedCluster dieselbe Cluster-Logik — gleiches Rauschfilter-
// Prinzip, nur an die gröbere Zoom-7-Pixelauflösung (~1.2km/Pixel) angepasst. Fenster und
// Mindestgröße bewusst enger als zuvor (half 4→3, Cluster 2→5px), damit die Vorwarnung erst
// bei näherer, flächigerer Bewölkung anschlägt statt bei jeder kleinen Zelle im ~10km-Umkreis.
const RV_CLUSTER_MIN_PX=5;
function radarClassifyAreaAtLoc(frameIdx,loc){
  return new Promise(resolve=>{
    const frame=radarFrames[frameIdx];
    if(!loc||!frame||!radarHost){resolve(false);return;}
    const z=7;
    const{tx,ty,px,py}=radarTileCoords(loc.lat,loc.lon,z);
    const url=`${radarHost}${frame.path}/256/${z}/${tx}/${ty}/2/1_1.png`;
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const canvas=document.createElement('canvas');
        canvas.width=256;canvas.height=256;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        const half=3;
        const x0=Math.max(0,px-half), y0=Math.max(0,py-half);
        const x1=Math.min(255,px+half), y1=Math.min(255,py+half);
        const d=ctx.getImageData(x0,y0,x1-x0+1,y1-y0+1).data;
        resolve(largestConnectedCluster(d,x1-x0+1,y1-y0+1,25)>=RV_CLUSTER_MIN_PX);
      }catch(e){resolve(false);}
    };
    img.onerror=()=>resolve(false);
    img.src=url;
  });
}
// Eng um den Punkt geschnittene Bbox fürs GetFeatureInfo unten — bewusst viel kleiner als
// dwdBbox() (die deckt ~6km für die Umkreis-Vorwarnung ab). Bei 3x3 Pixeln über ~1.5-2km
// Kantenlänge liegt die Mitte (x=1,y=1) nah am nativen 1km-Raster des DWD-Produkts; mit der
// breiten dwdBbox gemittelt worden wäre die Auflösung auf mehrere km verwässert.
function dwdPointBbox(loc){
  const d=0.01;
  return `${loc.lon-d},${loc.lat-d},${loc.lon+d},${loc.lat+d}`;
}
// Fragt den exakten Niederschlagswert (mm/h) am Standort per WMS GetFeatureInfo ab (DWD-Layer
// ist queryable) — genauer als eine Farb-Heuristik auf dem Kartenbild, da direkt der Messwert
// statt einer aus der Legendenfarbe geschätzten Intensität zurückkommt. Schwellwerte orientieren
// sich an der gängigen meteorologischen Einteilung leicht/mäßig/stark (<2,5 / 2,5-10 / >10 mm/h).
function dwdClassifyPointAtTime(loc,isoTime){
  return fetch('https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.1.1&request=GetFeatureInfo'+
    '&layers='+DWD_LAYER+'&query_layers='+DWD_LAYER+'&styles=&bbox='+dwdPointBbox(loc)+
    '&width=3&height=3&srs=EPSG:4326&x=1&y=1&info_format=application/json&feature_count=1&time='+isoTime)
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      const v=j&&j.features&&j.features[0]&&j.features[0].properties&&j.features[0].properties.RV_ANALYSIS;
      if(v==null||v<=0)return null;
      if(v>10)return{level:'stark',label:'kräftiger Regen'};
      if(v>=2.5)return{level:'mittel',label:'mäßiger Regen'};
      return{level:'leicht',label:'leichter Regen'};
    }).catch(()=>null);
}
// Blitzdichte-Punktabfrage für den "Jetzt"-Gewitterabgleich (analog zu dwdClassifyPointAtTime,
// aber auf dem Blitzdichte- statt dem Niederschlagslayer, siehe DWD_THUNDER_LAYER weiter unten).
// GRAY_INDEX>0 heißt: laut Layer-Beschreibung wurden in den letzten 15 Minuten am Standort Blitze
// erkannt. Sicherheitsabstand wie DWD_PUBLISH_LAG_MIN: das Blitzprodukt lag im Live-Test ~5-6 Min.
// hinter der Rain-Analyse zurück, eine exakte "Jetzt"-Anfrage schlägt sonst oft fehl (Fehlerfall
// wird über .catch(()=>false) toleriert, dann bleibt die Gewitter-Erkennung für diesen Zyklus aus).
function dwdClassifyThunderNow(loc){
  const now=new Date();
  now.setUTCSeconds(0,0);
  now.setUTCMinutes(Math.floor(now.getUTCMinutes()/5)*5-DWD_PUBLISH_LAG_MIN);
  return fetch('https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.1.1&request=GetFeatureInfo'+
    '&layers='+DWD_THUNDER_LAYER+'&query_layers='+DWD_THUNDER_LAYER+'&styles=&bbox='+dwdPointBbox(loc)+
    '&width=3&height=3&srs=EPSG:4326&x=1&y=1&info_format=application/json&feature_count=1&time='+now.toISOString())
    .then(r=>r.ok?r.json():null)
    .then(j=>(j?.features?.[0]?.properties?.GRAY_INDEX||0)>0)
    .catch(()=>false);
}
// Wie lange der aktuell laut Radar fallende Regen laut Kurzfristprognose noch anhält. Bewusst
// punktgenaue Klassifizierung (dwdClassifyPointAtTime/radarClassifyFrameAtLoc, dieselbe Quelle
// wie das "Jetzt"-Badge) statt der Umkreis-Cluster-Prüfung aus dwdClassifyAreaAtTime/
// radarClassifyAreaAtLoc — die ist für die Vorwarnung (Regen irgendwo im ~8-10km-Umkreis) gedacht
// und meldete hier fälschlich "regnet noch", wenn eine Zelle nur in der Nähe lag, aber nicht mehr
// exakt über dem Standort. Es wird nicht beim ersten trockenen Zwischenschritt gestoppt: zwei
// durch eine Lücke getrennte Regenphasen zählen als eine durchgehende Regenzeit — Rückgabe ist die
// letzte Minute mit erkanntem Regen, Lücken dazwischen werden also überbrückt. horizonMin ist die
// geprüfte Zeitspanne, damit der Aufrufer zwischen "hört auf" und "hält mindestens bis Prognose-
// ende an" unterscheiden kann.
async function radarEstimateRainEnd(loc){
  if(inGermany(loc.lat,loc.lon)){
    const steps=[15,30,45,60,75,90,105];
    const results=await Promise.all(dwdTimeSteps(steps).map(t=>dwdClassifyPointAtTime(loc,t)));
    let lastRainMin=null;
    results.forEach((info,i)=>{ if(info)lastRainMin=steps[i]; });
    return{lastRainMin,horizonMin:steps[steps.length-1]};
  }
  if(radarFrames.length&&radarHost){
    const stepMin=radarFrameStepMin();
    const futureIdxs=[];
    for(let i=radarPastLen;i<radarFrames.length;i++)futureIdxs.push(i);
    if(!futureIdxs.length)return{lastRainMin:null,horizonMin:0};
    const results=await Promise.all(futureIdxs.map(i=>radarClassifyFrameAtLoc(i,loc)));
    let lastRainMin=null;
    results.forEach((info,idx)=>{ if(info)lastRainMin=(idx+1)*stepMin; });
    return{lastRainMin,horizonMin:futureIdxs.length*stepMin};
  }
  return{lastRainMin:null,horizonMin:0};
}
// Eigenes Icon fürs Radar-Override statt des normalen Regen-Icons (🌧, siehe WMO_MAP) — so ist auf
// den ersten Blick erkennbar, dass das Symbol vom Radar und nicht vom Modell kommt.
const RADAR_RAIN_ICON='☔';
// Überschreibt bei laufendem Radar-Regen das Wettersymbol, falls das Modell noch ein trockenes
// Icon zeigt (Wolke/Sonne) — Vorwarnstufe für den Fall, dass das Modell einen sichtbaren Schauer
// noch nicht erfasst hat. Bei erkanntem Blitz laut Blitzdichte-Layer wird das Gewittersymbol
// statt des Regensymbols gezeigt. Der Hinweis, wie lange der Regen laut Kurzfristprognose noch
// anhält, wird an die bestehende Radar-Flag-Chip angehängt statt in einem eigenen Element
// darunter — sonst taucht das Symbol im Hero doppelt auf (Chip + Dauer-Hinweis).
// Setzt die zweite Hero-Statbox (Gewitter-% bzw. Regen-heute-%, siehe stat2Val/stat2Lbl in
// render()) auf einen festen Radar-Zustand statt der Modellzahl — sonst widerspricht die
// Statbox weiterhin dem Radar-korrigierten Hero-Icon (z.B. Icon zeigt ⛈ per Blitz-Erkennung,
// darunter steht aber unverändert "💧 12% Regen heute" aus dem Modell).
function setStat2FromRadar(thunder){
  const box=document.getElementById('stat2-box'), val=document.getElementById('stat2-val'), lbl=document.getElementById('stat2-lbl');
  if(!box)return;
  box.className=thunder?'stat-box thunder-stat':'stat-box';
  if(val)val.textContent=thunder?'⚡ Live':`💧 ${lastCur.rain_pct}%`;
  if(lbl)lbl.textContent=thunder?'Gewitter':'Regen heute';
}
let radarOverrideSeq=0;
async function radarApplyOverride(info,loc){
  const iconEl=document.getElementById('big-icon');
  const condEl=document.getElementById('hero-condition');
  if(!iconEl||!lastCur)return;
  // Ladeanimation (siehe .radar-pending) beenden — ab hier steht in jedem Zweig unten die
  // finale, radar-abgeglichene Anzeige fest.
  document.getElementById('hero-main')?.classList.remove('radar-pending');
  const seq=++radarOverrideSeq;
  if(!info){
    // Radar ist die Wahrheit: meldet es keinen Regen, obwohl Modell/Beobachtung gerade
    // Regen zeigen, dann im Hero nicht den Regen-Zustand stehen lassen, sondern "bewölkt".
    // Ohne Regen laut Radar kann auch kein Gewitter gerade laufen — Statbox entsprechend zurück
    // auf "Regen heute", falls sie das Modell-Gewitter-% zeigte.
    if(modelExpectsRain){
      iconEl.textContent='☁️';
      if(condEl)condEl.textContent='Bewölkt';
    }else{
      iconEl.textContent=lastCur.icon;
      if(condEl)condEl.textContent=lastCur.condition;
    }
    setStat2FromRadar(false);
    return;
  }
  const thunderNow=inGermany(loc.lat,loc.lon)?await dwdClassifyThunderNow(loc):false;
  if(seq!==radarOverrideSeq)return;
  // Radar/Blitzdichte haben Vorrang vor Modell/Station (Prioritätskette: Radar > Station >
  // Vorhersage) — bisher wurde bei modelExpectsRain==true einfach das Modell-Icon/-Text
  // übernommen, auch wenn die Blitzdichte-Abfrage gerade echten Blitz meldete (Modell sagte
  // "irgendein Regencode", aber nicht explizit Gewitter → Blitz ging unter). Jetzt gilt immer
  // die Radar-Beobachtung, unabhängig davon, was Modell/Station gerade zeigen.
  iconEl.textContent=thunderNow?'⛈':RADAR_RAIN_ICON;
  if(condEl)condEl.textContent=thunderNow?'Gewitter':(info.label[0].toUpperCase()+info.label.slice(1));
  // Nur bei radar-bestätigtem Blitz die Statbox erzwingen — bei Regen ohne aktuellen Blitz-Treffer
  // bleibt die Modellzahl stehen (Blitzdichte-Abfrage kann zwischen zwei Entladungen kurz leer
  // sein, ohne dass das Gewitter vorbei ist; ein Herunterstufen würde dann flackern).
  if(thunderNow)setStat2FromRadar(true);
  const end=await radarEstimateRainEnd(loc);
  const flagEl=document.getElementById('radar-flag');
  if(seq!==radarOverrideSeq||!flagEl)return;
  if(end.lastRainMin==null)flagEl.textContent+=' · hört gleich wieder auf';
  else if(end.lastRainMin>=end.horizonMin)flagEl.textContent+=` · hält mind. noch ${end.lastRainMin} Min. an`;
  else flagEl.textContent+=` · noch ca. ${end.lastRainMin} Min.`;
}
function radarSampleAtLocation(){
  // Sampelt bewusst immer den "Jetzt"-Zeitpunkt, unabhängig davon, welchen Zeitpunkt der
  // Slider gerade anzeigt — das Badge im aktuellen Wetterstatus soll nicht durch Zurückspulen
  // auf der Zeitleiste verfälscht werden. Für deutsche Standorte DWD (präziser, siehe
  // dwdClassifyPointAtTime), sonst weiterhin RainViewer-Pixel-Sampling als Fallback.
  if(!radarLoc){radarSetFlag(null);return;}
  const loc=radarLoc, seq=++radarSampleSeq;
  if(radarUsingDwdForLoc()){
    dwdClassifyPointAtTime(loc,dwdTimeSteps()[0]).then(info=>{
      if(seq===radarSampleSeq){radarSetFlag(info);radarApplyOverride(info,loc);radarCheckIncoming();}
    });
  }else if(radarFrames.length&&radarHost){
    radarClassifyFrameAtLoc(radarPastLen-1,loc).then(info=>{
      if(seq===radarSampleSeq){radarSetFlag(info);radarApplyOverride(info,loc);radarCheckIncoming();}
    });
  }else{
    radarSetFlag(null);
    radarApplyOverride(null,loc);
    radarCheckIncoming();
  }
}
// DWD-eigener WMS-Radar (RV-Produkt: Analyse + echte ~2h-Vorhersage, 1km, 5-Min-Raster,
// nur Deutschland) — präziser & verlässlicher als RainViewers Nowcast, der oft leer ist
// (per Live-Test bestätigt: RainViewer lieferte 0 Nowcast-Frames, während der DWD-Layer
// zum selben Zeitpunkt plausible Vorhersagedaten hatte). Statt eines Einzelpixels wird eine
// kleine Bbox (~6km, bewusst enger als zuvor ~11km) um den Standort abgefragt, damit eine
// nahe, aber noch nicht exakt über dem Standort liegende Regenzelle nicht übersehen wird —
// die Vorwarnung soll aber erst bei wirklich naher Bewölkung anschlagen, nicht bei jeder
// Zelle irgendwo im weiteren Umkreis.
function dwdBbox(loc){
  const dLat=0.03, dLon=0.045;
  return `${loc.lon-dLon},${loc.lat-dLat},${loc.lon+dLon},${loc.lat+dLat}`;
}
// 4-Nachbarschafts-Flood-Fill über die Alpha-Maske: liefert die Größe der größten zusammen-
// hängenden Fläche mit alpha>alphaThresh. Für die Vorwarnung reicht nicht irgendein einzelner
// Regen-Pixel (Rauschen/eine isolierte 1km-Radarzelle) — erst ein zusammenhängend größeres
// Feld soll anschlagen. Wiederverwendet von DWD- und RainViewer-Pfad (unterschiedliche
// Pixelauflösung, deshalb pro Aufrufer ein eigener Mindestgrößen-Schwellwert).
function largestConnectedCluster(data,w,h,alphaThresh){
  const n=w*h;
  const mask=new Uint8Array(n);
  for(let i=0;i<n;i++) mask[i]=data[i*4+3]>alphaThresh?1:0;
  const visited=new Uint8Array(n);
  let best=0,stack=[];
  for(let start=0;start<n;start++){
    if(!mask[start]||visited[start])continue;
    let size=0;
    stack.length=0;
    stack.push(start);
    visited[start]=1;
    while(stack.length){
      const idx=stack.pop();
      size++;
      const x=idx%w, y=(idx/w)|0;
      if(x>0&&mask[idx-1]&&!visited[idx-1]){visited[idx-1]=1;stack.push(idx-1);}
      if(x<w-1&&mask[idx+1]&&!visited[idx+1]){visited[idx+1]=1;stack.push(idx+1);}
      if(y>0&&mask[idx-w]&&!visited[idx-w]){visited[idx-w]=1;stack.push(idx-w);}
      if(y<h-1&&mask[idx+w]&&!visited[idx+w]){visited[idx+w]=1;stack.push(idx+w);}
    }
    if(size>best)best=size;
  }
  return best;
}
// Mindestgröße der zusammenhängenden Fläche im 50×50-Sample (~6×6km Bbox, ~0.12km/Pixel) —
// deutlich höher als die ursprünglichen 10px: die Vorwarnung soll erst bei einer wirklich
// flächigen Regenzelle in der Nähe anschlagen, nicht schon bei einer isolierten kleinen Zelle.
const DWD_CLUSTER_MIN_PX=30;
function dwdClassifyAreaAtTime(loc,isoTime){
  return new Promise(resolve=>{
    const url='https://maps.dwd.de/geoserver/dwd/wms?service=WMS&version=1.1.1&request=GetMap'+
      '&layers=dwd:Radar_rv_product_1x1km_ger&styles=&bbox='+dwdBbox(loc)+
      '&width=50&height=50&srs=EPSG:4326&format=image/png&transparent=true&time='+isoTime;
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const canvas=document.createElement('canvas');
        canvas.width=50;canvas.height=50;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        const d=ctx.getImageData(0,0,50,50).data;
        resolve(largestConnectedCluster(d,50,50,25)>=DWD_CLUSTER_MIN_PX);
      }catch(e){resolve(false);}
    };
    img.onerror=()=>resolve(false);
    img.src=url;
  });
}
// Zeitschritte (Standard 0/15/30/45/60 Min.), auf das 5-Minuten-Raster der DWD-Zeitdimension
// abgerundet. minutesList erlaubt anderen Aufrufern (radarEstimateRainEnd) einen weiteren Horizont.
function dwdTimeSteps(minutesList){
  const now=new Date();
  now.setUTCSeconds(0,0);
  now.setUTCMinutes(Math.floor(now.getUTCMinutes()/5)*5);
  return (minutesList||[0,15,30,45,60]).map(m=>new Date(now.getTime()+m*60000).toISOString());
}
async function dwdRadarCheckIncoming(loc){
  const results=await Promise.all(dwdTimeSteps().map(t=>dwdClassifyAreaAtTime(loc,t)));
  let firstIncomingMin=null;
  results.forEach((rain,idx)=>{ if(rain&&firstIncomingMin==null) firstIncomingMin=idx*15; });
  return firstIncomingMin;
}
// Vergleicht die Vorwarnung (DWD für deutsche Standorte, sonst RainViewers eigener Kurzfrist-
// Nowcast als Fallback — siehe fetchRadarFrames, ~30-60 Min. Horizont, Bewegungsextrapolation
// aus Radarechos) am Standort mit der Modell-Konsens-Regenwahrscheinlichkeit der aktuellen
// Stunde (lastHourlyNow, siehe render()). Deckt genau den Fall ab, dass eine herannahende
// Regenzelle sichtbar ist, die die (gröber auflösenden) Modelle kurzfristig noch nicht erfassen.
let radarIncomingSeq=0;
async function radarCheckIncoming(){
  const el=document.getElementById('radar-incoming');
  if(!el)return;
  if(!radarLoc||!lastHourlyNow||radarRainingNow){
    el.style.display='none';
    return;
  }
  const loc=radarLoc, seq=++radarIncomingSeq;
  let firstIncomingMin=null;
  if(inGermany(loc.lat,loc.lon)){
    firstIncomingMin=await dwdRadarCheckIncoming(loc);
  }else{
    const futureSteps=radarFrames.length-radarPastLen;
    if(radarFrames.length&&radarHost&&futureSteps>=1){
      const stepMin=radarFrameStepMin();
      const nowcastIdxs=[];
      for(let i=radarPastLen;i<radarFrames.length;i++) nowcastIdxs.push(i);
      const results=await Promise.all(nowcastIdxs.map(i=>radarClassifyAreaAtLoc(i,loc)));
      results.forEach((rain,idx)=>{ if(rain&&firstIncomingMin==null) firstIncomingMin=(idx+1)*stepMin; });
    }
  }
  if(seq!==radarIncomingSeq)return;
  if(firstIncomingMin!=null&&firstIncomingMin<=60&&lastHourlyNow.rain<30){
    el.style.display='block';
    el.textContent=firstIncomingMin===0
      ? `${RADAR_INFO_ICON} Laut Radar gerade Regen in der Nähe — Modelle zeigen aktuell nur ${lastHourlyNow.rain}%.`
      : `${RADAR_INFO_ICON} Radar-Prognose: in ca. ${firstIncomingMin} Min. könnte Regen eintreffen — Modelle zeigen aktuell nur ${lastHourlyNow.rain}%.`;
  }else{
    el.style.display='none';
  }

async function fetchRadarFrames(){
  if(!radarMap)return;
  try{
    const r=await fetch('https://api.rainviewer.com/public/weather-maps.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    radarHost=j.host;
    radarFrames=[...(j.radar?.past||[]),...(j.radar?.nowcast||[])];
    radarPastLen=(j.radar?.past||[]).length;
    if(!radarFrames.length)throw new Error('Keine Radardaten verfügbar');
    radarSampleAtLocation();
    // Satelliten-"Jetzt"-Bild schon jetzt im Hintergrund vorladen (unabhängig vom aktiven
    // Tab), damit es beim Wechsel auf "Wolken" meist schon aus dem Cache kommt.
    prefetchSatNow();
    // Sichtbare Kartenanzeige nur mit RainViewer bestücken, wenn der aktuelle Standort nicht
    // in Deutschland liegt — sonst würde dieser asynchrone Fetch die bereits (synchron in
    // radarSetCenter) gerenderte DWD-Karte überschreiben (Race Condition).
    if(!radarUsingDwdForLoc())showRainViewerDisplay();
  }catch(e){
    if(!radarUsingDwdForLoc()){
      document.getElementById('radar-time').textContent='Radar nicht verfügbar';
      document.getElementById('radar-note').textContent='Radardaten konnten nicht geladen werden.';
    }

}
// Zeitachse, Karte und Hinweistext auf die RainViewer-Frames stellen (Standorte außerhalb
// Deutschlands). Aufgerufen nach dem Frame-Abruf und beim Standortwechsel weg aus Deutschland.
function showRainViewerDisplay(){
  radarIndex=radarPastLen-1;
  const slider=document.getElementById('radar-slider');
  slider.max=radarFrames.length-1;
  slider.value=radarIndex;
  radarBuildTicks();
  radarRenderFrame(radarIndex);
  radarPrefetchTiles();
  const futureSteps=radarFrames.length-radarPastLen;
  const futureMin=futureSteps*radarFrameStepMin();
  document.getElementById('radar-note').textContent=futureSteps>0
    ? `Vergangene ~2 Std. + ${futureMin} Min. Kurzfrist-Prognose (RainViewer) — Prognose ist kein garantierter Teil der kostenlosen API, Verlässlichkeit nimmt Richtung Prognose-Ende ab.`
    : 'Vergangene ~2 Std. (RainViewer). Eine Kurzfrist-Prognose ist kein garantierter Teil der kostenlosen API und wird nur angezeigt, wenn RainViewer gerade welche berechnet hat.';
}
function radarFrameStepMin(){
  const f=activeFrames();
  if(f.length<2)return 10;
  return Math.round((f[1].time-f[0].time)/60)||10;
}
function radarBuildTicks(){
  const wrap=document.getElementById('radar-ticks');
  const f=activeFrames(), pastLen=activePastLen();
  const n=f.length;
  if(n<2){wrap.innerHTML='';return;}
  let html='';
  f.forEach((fr,i)=>{
    const pct=(i/(n-1))*100;
    const isNow=i===pastLen-1;
    const d=new Date(fr.time*1000);
    // Exakt volle Stunde, nicht nur "<10" — bei RainViewers altem 10-Min-Raster traf "<10" nur
    // auf :00 zu, beim DWD-5-Min-Raster aber fälschlich auch auf :05, was zu zwei überlappenden
    // Stunden-Beschriftungen pro Stunde führte.
    const isHour=d.getMinutes()===0;
    if(isNow){
      html+=`<div class="radar-tick now" style="left:${pct}%"></div><div class="radar-tick-label now" style="left:${pct}%">Jetzt</div>`;
    }else if(isHour){
      const lbl=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      html+=`<div class="radar-tick hour" style="left:${pct}%"></div><div class="radar-tick-label" style="left:${pct}%">${lbl}</div>`;
    }else{
      html+=`<div class="radar-tick" style="left:${pct}%"></div>`;
    }
  });
  wrap.innerHTML=html;
}
function radarRenderFrame(i){
  const f=activeFrames(), pastLen=activePastLen();
  const frame=f[i];
  if(!frame||!radarMap)return;
  // Beschriftung und Badge zuerst und immer synchron — sie hängen nicht am Bild und sollen
  // dem Slider ohne Verzögerung folgen, auch wenn der Frame selbst noch geladen wird.
  const offsetMin=(i-(pastLen-1))*radarFrameStepMin();
  const isForecast=i>=pastLen;
  const label=offsetMin===0?'Jetzt':(offsetMin>0?`Prognose +${offsetMin} Min.`:`${Math.abs(offsetMin)} Min. zurück`);
  document.getElementById('radar-time').textContent=label;
  const badge=document.getElementById('radar-badge');
  badge.textContent=isForecast?'PROGNOSE':'LIVE';
  badge.classList.toggle('forecast',isForecast);
  if(radarOverlayMode())radarShowOverlayFrame(i);
  else radarShowTileFrame(frame);
  radarSyncThunderOverlay(i);
}
// Kein Debounce mehr vor dem Rendern: bereits geladene Frames werden direkt aus dem Speicher
// gezeichnet, das ist billiger als das alte Warten und folgt dem Slider ohne Nachlauf. Die
// Bremse sitzt jetzt eine Ebene tiefer — nur der Netzwerk-Request für noch fehlende Frames
// wird in radarShowOverlayFrame verzögert.
function radarSeek(i){
  radarIndex=+i;
  radarRenderFrame(radarIndex);
  // Sobald der Zeitzähler einmal bewegt wird, den kompletten Frame-Vorrat im Hintergrund
  // durchladen (nicht nur den einzelnen angesteuerten Frame) — danach läuft weiteres Scrubben
  // komplett aus dem Speicher. radarImgLoad überspringt bereits geladene/wartende Frames, daher
  // ist der wiederholte Aufruf bei jedem Slider-Event unkritisch.
  if(radarOverlayMode())radarPrefetchFrames();
  else radarPrefetchTiles();
}
function radarTogglePlay(){

function radarSwitchMode(mode){

// Exakt dieselbe Zeitachse wie das Regenradar (gleiche Zeitpunkte, gleiche Taktung) —
// nur der Vergangenheits-Teil, Satellit liefert keine Prognose. So verhalten sich Ticks,
// "Jetzt"/"X Min. zurück"-Beschriftung und Slider identisch zum Regenradar-Tab.
// Fallback (10-Min-Takt über 2 Std.) nur falls der Regenradar-Abruf fehlgeschlagen ist.
// Meteosat-Bilder brauchen nach der Aufnahme ca. 10 Min., bis sie bei EUMETSAT abrufbar
// sind — ein Request auf die exakte "Jetzt"-Zeit des Regenradars schlägt fast immer fehl
// ("No nearest match found"). Deshalb läuft die Satelliten-Zeitachse diesem Puffer entsprechend
// der Realität hinterher (gleiche Taktung/Anzahl wie das Regenradar, nur insgesamt versetzt).
const SAT_LATENCY_MIN=20;
function fetchSatFrames(){
  if(!radarMap)return;
  if(!radarViewCovers())radarNewView();
  if(radarFrames.length&&radarPastLen){
    satFrames=radarFrames.slice(0,radarPastLen).map(f=>({time:f.time-SAT_LATENCY_MIN*60}));
  }else{
    const stepMs=10*60000, nFrames=13;
    const rounded=Math.floor(Date.now()/stepMs)*stepMs-SAT_LATENCY_MIN*60000;
    satFrames=[];
    for(let i=nFrames-1;i>=0;i--)satFrames.push({time:Math.floor((rounded-i*stepMs)/1000)});
  }
  radarIndex=satFrames.length-1;
  const slider=document.getElementById('radar-slider');
  slider.max=satFrames.length-1;
  slider.value=radarIndex;
  radarBuildTicks();
  radarRenderFrame(radarIndex);
  document.getElementById('radar-note').textContent='Meteosat Third Generation IR10.5 μm (EUMETSAT, 1 km, frei zugänglich). Graustufen: heller = kälterer/höherer Wolkenschirm — funktioniert auch nachts. Keine Prognose, nur Beobachtung.';
  // Alle Frames im Hintergrund vorladen und im Speicher behalten, damit Scrubben danach ohne
  // Netzwerk läuft (siehe Frame-Engine oben).
  radarPrefetchFrames();
}
// ── Satelliten-Abgleich für "Jetzt" (dieselbe EUMETSAT-Quelle wie oben) ──────
// Einzelbild-Overlay statt Kachelraster fürs DWD-Regenradar — analog zu satOverlayUrl unten.
// Ein großer GetMap-Request pro Frame statt mehrerer Kachel-Requests; die Bbox kommt aus der
// Frame-Engine (radarComputeView) und ist bewusst etwas größer als der sichtbare Ausschnitt,
// damit kleine Kartenbewegungen den vorgeladenen Bildvorrat nicht entwerten.
function dwdOverlayUrl(iso){
  const v=radarEnsureView();
  return `${DWD_WMS}?service=WMS&version=1.3.0&request=GetMap&layers=${DWD_LAYER}&styles=&format=image/png&transparent=true&crs=CRS:84&bbox=${v.bbox}&width=${v.w}&height=${v.h}&time=${encodeURIComponent(iso)}`;
}
const DWD_THUNDER_LAYER='dwd:Blitzdichte';
function thunderOverlayUrl(iso){
  const v=radarEnsureView();
  return `${DWD_WMS}?service=WMS&version=1.3.0&request=GetMap&layers=${DWD_THUNDER_LAYER}&styles=&format=image/png&transparent=true&crs=CRS:84&bbox=${v.bbox}&width=${v.w}&height=${v.h}&time=${encodeURIComponent(iso)}`;
}
// Blitzdichte-Overlay über dem Regenradar: eigene Canvas-Ebene über radarCanvas (höherer
// zIndex), immer eingeblendet, kein Toggle nötig. Läuft über denselben Zeitindex wie der
// Regen-Frame (dwdFrames liefert für Regen und Blitze dieselben 5-Min-Zeitstempel) — nur im
// Regen-Tab und nur für deutsche Standorte relevant; für Prognose-Frames (i>=dwdPastLen) gibt
// es keine Blitzdaten, der DWD liefert dafür keine Vorhersage.
// Eigener Filter statt der DWD-Originalfarben: die Blitzdichte-Skala (grün→gelb→rot→lila)
// überschneidet sich stark mit der Regen-Farbskala und ginge sonst im Regen-Layer unter. Der
// dunkle Schlagschatten zeichnet einen Rand um jede Zelle, der sie von jeder Regenfarbe darunter
// abhebt, saturate/contrast machen die Blitzfarben selbst kräftiger.
const RADAR_THUNDER_FILTER='saturate(2) contrast(1.35) drop-shadow(0 0 3px rgba(0,0,0,.85))';
let radarThunderCanvas=null, radarThunderCanvasView=null, radarThunderWantedUrl=null, radarThunderWantTimer=null;
// Welcher dwdFrames-Index für den Blitzdichte-Layer bei Frame i tatsächlich abgefragt wird —
// bei "Jetzt" (i===dwdPastLen-1) der letzte tatsächlich veröffentlichte Frame, siehe Kommentar
// in radarSyncThunderOverlay. Eigene Funktion, damit radarPrefetchFrames() dieselbe Zuordnung
// im Hintergrund vorlädt statt sie nur beim tatsächlichen Erreichen des Frames anzufragen.
function thunderFrameIdx(i){ return i===dwdPastLen-1 ? Math.max(i-1,0) : i; }
function radarSyncThunderOverlay(i){
  const show=radarMode==='rain'&&radarUsingDwdForLoc()&&i<dwdPastLen;
  if(!show){
    radarThunderWantedUrl=null;
    if(radarThunderCanvas){radarMap.removeLayer(radarThunderCanvas);radarThunderCanvas=null;radarThunderCanvasView=null;}
    return;
  }
  const view=radarEnsureView();
  if(!radarThunderCanvas){
    radarThunderCanvas=new (radarCanvasClass())('',view.bounds,{opacity:.85,zIndex:410});
    radarThunderCanvas.addTo(radarMap);
    radarThunderCanvasView=view;
    radarThunderCanvas._image.style.filter=RADAR_THUNDER_FILTER;
  }
  // Der "Jetzt"-Frame (i===dwdPastLen-1) fragt beim Blitzdichte-Layer oft noch unveröffentlichte
  // Daten ab — das Produkt lag im Live-Test ~5-6 Min. hinter der Regen-Analyse zurück (siehe
  // dwdClassifyThunderNow), während der Regen-Layer selbst zu diesem Zeitpunkt schon reguläre
  // Daten hat. Ohne Anpassung bliebe der Blitz-Overlay bei "Jetzt" leer, auch wenn tatsächlich
  // ein Gewitter läuft. Deshalb wird für diesen einen Frame stattdessen der letzte tatsächlich
  // beobachtete Frame (einen 5-Min-Schritt zurück) angezeigt — das Blitzbild ist dann zwar ein
  // paar Minuten alt, aber real und keine leere Kachel.
  const url=thunderOverlayUrl(radarFrameIso(dwdFrames[thunderFrameIdx(i)]));
  radarThunderWantedUrl=url;
  const paint=e=>{
    if(!radarThunderCanvas||!e.img)return;
    if(e.view&&radarThunderCanvasView!==e.view){radarThunderCanvas.setBounds(e.view.bounds);radarThunderCanvasView=e.view;}
    radarThunderCanvas.drawFrame(e.img);
  };
  const cached=radarImgCache.get(url);
  if(cached&&cached.state==='ok'&&cached.img){paint(cached);return;}
  // Dasselbe Scrub-Debounce wie beim Hauptlayer (radarShowOverlayFrame): sonst löst jede
  // Zwischenposition beim Ziehen des Sliders einen eigenen WMS-Request aus.
  clearTimeout(radarThunderWantTimer);
  radarThunderWantTimer=setTimeout(()=>{
    if(radarThunderWantedUrl!==url)return;
    radarImgLoad(url,1,e=>{ if(radarThunderWantedUrl===e.url)paint(e); });
  },70);
}
const EUMETSAT_WMS='https://view.eumetsat.int/geoserver/wms';
// Einzelbild-Overlay statt Kachelraster: EUMETSATs WMS rendert on-the-fly (kein CDN wie
// RainViewer) — ein großes Bild pro Frame ist spürbar schneller als 8 Kacheln pro Frame.
function satOverlayUrl(iso){
  const v=radarEnsureView();
  return `${EUMETSAT_WMS}?service=WMS&version=1.3.0&request=GetMap&layers=mtg_fd:ir105_hrfi&styles=&format=image/png&transparent=true&crs=CRS:84&bbox=${v.bbox}&width=${v.w}&height=${v.h}&time=${encodeURIComponent(iso)}`;
}
function prefetchSatNow(){
  if(!radarMap||!radarFrames.length||!radarEnsureView())return;
  const iso=new Date((radarFrames[radarPastLen-1].time-SAT_LATENCY_MIN*60)*1000).toISOString().replace(/\.\d{3}Z$/,'Z');
  radarImgLoad(satOverlayUrl(iso),5);
}
// Konservativer Grauwert-Schwellwert (der Kanal ist ein reiner Grauverlauf, R=G=B): darunter
// dominiert die warme Erdoberfläche das Pixel, es liegt also kein kalter/hoher Wolkenschirm
// über dem Standort. Ursprünglich an Wüsten- (~0) und Nordatlantik-Tiefausläufern (~150)
// orientiert; 100 erwies sich aber als zu hoch — bei realer dünner/schwacher Bewölkung
// (Sonne kommt nur schwach durch) wurde ~38 gemessen und fälschlich als "klar" gewertet.
// Deutlich niedriger angesetzt (20), auf Kosten dafür, dass echtes Klarwetter an kühleren
// Tagen seltener erkannt wird.
// 11.08.2026: Nach Umstieg auf MTG (siehe EUMETSAT_WMS-Layer oben) meldete die App bei
// bestätigt wolkenlosem Himmel in Füssen "Bedeckt" per Stations-Override, weil dort real ~37-41
// gemessen wurde — deutlich über der alten 20er-Schwelle. Live vor Ort verifiziert (11.08.2026,
// Füssen, bestätigt wolkenlos) und mit Marge auf 45 angehoben. Die zwei Referenzmessungen (~38 bei
// echter dünner Bewölkung vs. ~37-41 bei echtem Klarwetter) liegen nah beieinander — der
// IR-Kanal allein trennt in dieser Zone nicht zuverlässig, das bleibt eine Kompromiss-Schwelle.
// 16.08.2026: Gegenrichtung — bei tatsächlich teilweise bewölktem Himmel über Füssen (live
// bestätigt) lag der Messwert bei ~39.7, also unterhalb der 45er-Schwelle, und der Satelliten-
// Override hätte den Himmel fälschlich als "klar" gewertet. Damit liegen jetzt drei Referenzen
// in derselben Zone (~38 dünne Bewölkung, ~37-41 klar, ~39.7 teilweise bewölkt) — die Zone taugt
// also nicht als "klar"-Indikator. Schwelle konservativ auf 35 gesenkt (unterhalb aller bisherigen
// "nicht klar"-Messwerte), auf Kosten dafür, dass echtes Klarwetter in der Grauzone seltener per
// Override erkannt wird.
const SAT_CLEAR_LUM_MAX=35;
// Zweiter, deutlich höherer Schwellwert für die Gegenrichtung (Station meldet klar, Satellit
// zeigt aber Wolken): nur ein eindeutig erkennbarer kalter/hoher Wolkenschirm soll die Station
// überstimmen. Dazwischen (45-55) bleibt bewusst unentschieden — weder clear noch cloudy greift,
// um nicht bei jeder Grauzonen-Messung hin- und herzuspringen.
const SAT_CLOUDY_LUM_MIN=55;
// Liefert {clear, cloudy}: clear=true nur unter SAT_CLEAR_LUM_MAX, cloudy=true nur ab
// SAT_CLOUDY_LUM_MIN, sonst jeweils false; bei Sample-Fehler beide null (unbekannt).
// Gemittelt über einen 3x3-Block statt Einzelpixel, um Rauschen/Wolkenkanten-Artefakte und
// Georegistrierungs-Versatz (Kachel vs. exakter Standort) zu glätten.
function sampleSatelliteSky(lat,lon){
  return new Promise(resolve=>{
    const d=0.15;
    const bbox=`${lon-d},${lat-d},${lon+d},${lat+d}`;
    const url=`${EUMETSAT_WMS}?service=WMS&version=1.3.0&request=GetMap&layers=mtg_fd:ir105_hrfi&styles=&format=image/png&crs=CRS:84&bbox=${bbox}&width=16&height=16`;
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');
        c.width=16;c.height=16;
        const ctx=c.getContext('2d');
        ctx.drawImage(img,0,0);
        const px=ctx.getImageData(7,7,3,3).data;
        let sum=0,n=0;
        for(let i=0;i<px.length;i+=4){ sum+=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]; n++; }
        const lum=sum/n;
        resolve({clear:lum<SAT_CLEAR_LUM_MAX, cloudy:lum>=SAT_CLOUDY_LUM_MIN});
      }catch(e){resolve({clear:null,cloudy:null});}
    };
    img.onerror=()=>resolve({clear:null,cloudy:null});
    img.src=url;
  });
}

let dragState=null, dragSuppressClick=false, dragIndicator=null;
function initFavDrag(){
  const el=document.getElementById('loc-chips');
  el.addEventListener('pointerdown',favDragStart);
  el.addEventListener('pointermove',favDragMove);
  el.addEventListener('pointerup',favDragEnd);
