function favDragStart(e){
  if(!favEditMode)return;
  if(e.target.closest('.chip-remove'))return;
  const chip=e.target.closest('.chip.fav');
  if(!chip)return;
  dragState={pointerId:e.pointerId,el:chip,startX:e.clientX,startY:e.clientY,moved:false};
}
function favDragMove(e){
  if(!dragState||e.pointerId!==dragState.pointerId)return;
  const chip=dragState.el;
  const dx=e.clientX-dragState.startX, dy=e.clientY-dragState.startY;
  if(!dragState.moved){
    if(Math.hypot(dx,dy)<6)return;
    dragState.moved=true;
    const r=chip.getBoundingClientRect();
    dragState.origLeft=r.left;dragState.origTop=r.top;
    try{chip.setPointerCapture(e.pointerId);}catch(err){}
    dragIndicator=document.createElement('div');
    dragIndicator.className='drop-indicator';
    chip.parentNode.insertBefore(dragIndicator,chip);
    chip.classList.add('dragging');
    chip.style.position='fixed';
    chip.style.left=r.left+'px';
    chip.style.top=r.top+'px';
    chip.style.width=r.width+'px';
  }
  e.preventDefault();
  chip.style.left=(dragState.origLeft+dx)+'px';
  chip.style.top=(dragState.origTop+dy)+'px';
  const container=document.getElementById('loc-chips');
  const siblings=[...container.querySelectorAll('.chip.fav')].filter(c=>c!==chip);
  let placed=false;
  for(const sib of siblings){
    const r=sib.getBoundingClientRect();
    if(e.clientX<r.left+r.width/2){
      container.insertBefore(dragIndicator,sib);
      placed=true;
      break;
    }
  }
  if(!placed){
    const addBtn=container.querySelector('.chip.add-btn');
    container.insertBefore(dragIndicator,addBtn||null);
  }
}
function favDragEnd(e){
  if(!dragState||e.pointerId!==dragState.pointerId)return;
  const wasMoved=dragState.moved;
  const chip=dragState.el;
  if(wasMoved){
    const container=document.getElementById('loc-chips');
    container.insertBefore(chip,dragIndicator);
    dragIndicator.remove();dragIndicator=null;
    chip.classList.remove('dragging');
    chip.style.position='';chip.style.left='';chip.style.top='';chip.style.width='';
    const keys=[...container.querySelectorAll('.chip.fav')].map(c=>c.dataset.key);
    favs=keys.map(k=>favs.find(f=>favKey(f)===k)).filter(Boolean);
    persistFavs();
    dragSuppressClick=true;
    renderChips();
  }
  dragState=null;
}

async function runAltCalc(lat,lon,elevation,name,labelIcon){
  const box=document.getElementById('alt-result');
  const myId=++altReqId;
  box.innerHTML='<div class="sr-note">Berechne Höhenwetter…</div>';
  try{
    const r=await fetch(altUrl(lat,lon));
    if(myId!==altReqId)return;
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(myId!==altReqId)return;
    const h=j.hourly;
    if(!h||!h.time) throw new Error('Unerwartetes Antwortformat');
    const nowIso=nowHourISOAt(j.utc_offset_seconds);
    let idx=h.time.findIndex(t=>t.slice(0,13)>=nowIso);
    if(idx<0) idx=0;
    const hours=[];
    for(let i=idx;i<Math.min(h.time.length,idx+24);i++){
      const levels=ALT_LEVELS.map(lv=>({h:h[`geopotential_height_${lv}hPa`][i],t:h[`temperature_${lv}hPa`][i]}))
        .filter(p=>p.h!=null&&p.t!=null).sort((a,b)=>a.h-b.h);
      const interp=interpTempAtHeight(levels,elevation);
      if(!interp) continue;
      hours.push({
        iso:h.time[i],
        temp:Math.round(interp.temp*10)/10,
        modeled:interp.modeled,
        rain:Math.round(h.precipitation_probability[i]||0),
        rainMm:Math.round((h.precipitation[i]||0)*10)/10,
        weatherCode:h.weather_code[i],
        thunder:thunderPct(h.weather_code[i]),
        freezingLevel:h.freezing_level_height[i]
      });
    }
    if(!hours.length) throw new Error('Keine Höhendaten verfügbar');
    const days=computeAltDays(h,elevation);
    box.innerHTML=renderAltResult(name,elevation,hours,labelIcon,days);
  }catch(e){
    if(myId!==altReqId)return;
    box.innerHTML=`<div class="sr-note">Höhenwetter konnte nicht berechnet werden (${esc(e.message||'Fehler')}).</div>`;
  }
}
// Tagesabschnitte (Morgens/Mittags/Abends) für die nächsten 5 Tage — analog zur Morgens/Mittags/
// Abends-Aufteilung der normalen Tagesvorhersage (siehe buildWeatherData), aber mit der auf die
// Zielhöhe interpolierten Temperatur statt raw.hourly.temperature_2m.
function computeAltDays(h,elevation){
  const dayHours={};
  h.time.forEach((t,idx)=>{const ds=t.slice(0,10);(dayHours[ds]=dayHours[ds]||[]).push(idx);});
  const hourAt=ix=>+h.time[ix].slice(11,13);
  const tempAt=ix=>{
    const levels=ALT_LEVELS.map(lv=>({h:h[`geopotential_height_${lv}hPa`][ix],t:h[`temperature_${lv}hPa`][ix]}))
      .filter(p=>p.h!=null&&p.t!=null).sort((a,b)=>a.h-b.h);
    const interp=interpTempAtHeight(levels,elevation);
    return interp?interp.temp:null;
  };
  return Object.keys(dayHours).slice(0,5).map(ds=>{
    const hIdxs=dayHours[ds];
    const parts=[['Morgens',6,11],['Mittags',12,17],['Abends',18,23]].map(([lbl,h1,h2])=>{
      const ixs=hIdxs.filter(ix=>hourAt(ix)>=h1&&hourAt(ix)<=h2);
      if(!ixs.length) return null;
      const temps=ixs.map(tempAt).filter(v=>v!=null);
      if(!temps.length) return null;
      const codes=ixs.map(ix=>h.weather_code[ix]);
      const segRain=Math.round(Math.max(...ixs.map(ix=>h.precipitation_probability[ix]||0)));
      const rc=reconcileCode(pickDayCode(codes),segRain);
      const [pic,pco]=wmoIcon(rc);
      const rainMm=Math.round(ixs.reduce((s,ix)=>s+(h.precipitation[ix]||0),0)*10)/10;
      const wind=Math.round(Math.max(...ixs.map(ix=>h.wind_speed_10m[ix]||0)));
      return {lbl,icon:pic,cond:pco,
        tmin:Math.round(Math.min(...temps)),tmax:Math.round(Math.max(...temps)),
        rain:segRain,rainMm,wind,thunder:Math.max(...codes.map(thunderPct))};
    }).filter(Boolean);
    if(!parts.length) return null;
    // Tageswerte fürs kompakte Karten-Grid — analog zur Aggregation in buildWeatherData
    // (forecast[]), aber aus den auf die Zielhöhe interpolierten Werten statt raw.hourly.
    const dayTemps=hIdxs.map(tempAt).filter(v=>v!=null);
    const windowCodes=hIdxs.filter(ix=>hourAt(ix)>=9&&hourAt(ix)<=18).map(ix=>h.weather_code[ix]);
    const dayCodes=windowCodes.length?windowCodes:hIdxs.map(ix=>h.weather_code[ix]);
    const dayRain=Math.round(Math.max(...hIdxs.map(ix=>h.precipitation_probability[ix]||0)));
    const [dIcon,dCond]=wmoIcon(reconcileCode(pickDayCode(dayCodes),dayRain));
    const dt=new Date(ds+'T00:00:00');
    return {
      wd:['So','Mo','Di','Mi','Do','Fr','Sa'][dt.getDay()],date:`${ds.slice(8,10)}.${ds.slice(5,7)}.`,
      icon:dIcon,cond:dCond,
      max:dayTemps.length?Math.round(Math.max(...dayTemps)):null,
      min:dayTemps.length?Math.round(Math.min(...dayTemps)):null,
      rain:dayRain,
      rainMm:Math.round(hIdxs.reduce((s,ix)=>s+(h.precipitation[ix]||0),0)*10)/10,
      wind:Math.round(Math.max(...hIdxs.map(ix=>h.wind_speed_10m[ix]||0))),
      thunder:Math.max(...dayCodes.map(thunderPct)),
      parts
    };
  }).filter(Boolean);
}
// Kompakte Tageskarten-Reihe + Antippen-für-Details — dasselbe Muster wie die normale
// 5-Tage-Vorschau (fc-scroll/fc-card + day-detail via toggleDay), eigener State (altSelDay/
// lastAltDays) und eigene DOM-IDs, damit sich die beiden Kartenreihen beim Antippen nicht

function altCloseDay(){

    <div class="dd-grid">

      <div class="dd-rain">💧 ${p.rain}%${p.rainMm>=0.1?` · ${p.rainMm}mm`:''}${p.thunder>25?` · ⚡${p.thunder}%`:''}</div>
      <div class="dd-wind">🌬 ${p.wind} km/h</div>
    </div>`).join('')}
    </div>`;
}
function renderAltResult(name,elevation,hours,labelIcon,days){
  const now=hours[0];
  const rc=reconcileCode(now.weatherCode,now.rain);
  const [icon,cond]=wmoIcon(rc);
  const showTh=now.thunder>25;
  const fl=now.freezingLevel;
  // Nullgradgrenze nur anzeigen, wenn laut reconcileCode auch tatsächlich Niederschlag ansteht
  // (dry=Code<=48) — sonst wäre "voraussichtlich Regen/Schnee" bei 0% Regenrisiko irreführend.
  const dry=rc<=48;
  const flLine=(!dry&&fl!=null&&isFinite(fl))
    ? `<div class="alt-fl">${elevation>fl?'❄️':'🌧️'} Nullgradgrenze ${Math.round(fl)} m</div>`
    : '';
  const cells=hours.map((c,i)=>{
    const isNow=i===0;
    const cRc=reconcileCode(c.weatherCode,c.rain);
    const [ic]=wmoIcon(cRc);
    const rainTxt=c.rain>0?`💧${c.rain}%`:`<span style="opacity:.3">💧–</span>`;
    const cls=['h-cell',isNow?'h-now':'',c.thunder>40?'h-storm':''].filter(Boolean).join(' ');
    return `<div class="${cls}"><div class="h-lbl">${isNow?'Jetzt':c.iso.slice(11,16)}</div><span class="h-icon">${ic}</span><div class="h-temp" style="color:${tempCol(c.temp)}">${c.temp}°</div><div class="h-rain">${rainTxt}</div>${c.rainMm>=0.1?`<div class="h-rain">${c.rainMm}mm</div>`:''}${c.thunder>25?`<div class="h-thunder">⚡${c.thunder}%</div>`:''}</div>`;
  }).join('');
  return `
    <div class="alt-peak-label">${labelIcon} <strong>${esc(name)}</strong> · ${elevation} m</div>
    <div class="hero-stats" style="grid-template-columns:repeat(3,1fr);margin-top:10px">
      <div class="stat-box"><div class="sv" style="color:${tempCol(now.temp)}">${icon} ${now.temp}°C</div><div class="sl">${esc(cond)}</div>${flLine}</div>
      <div class="stat-box"><div class="sv">💧 ${now.rain}%</div><div class="sl">Regen${now.rainMm>=0.1?` · ${now.rainMm}mm`:''}</div></div>
      <div class="${showTh?'stat-box thunder-stat':'stat-box'}"><div class="sv">⚡ ${now.thunder}%</div><div class="sl">Gewitter</div></div>
    </div>
    <div class="hourly-scroll" style="padding:14px 0 0"><div class="hourly-inner">${cells}</div></div>
    <div class="alt-note">Modellschätzung (Interpolation zwischen Druckflächen${hours.some(c=>!c.modeled)?', teils Extrapolation mit Standardatmosphäre':''}), keine lokalen Effekte wie Sonnenexposition, Kaltluftseen oder Wind berücksichtigt.</div>
    ${renderAltDays(days)}
  `;
}

let isLoading=false, hasRendered=false, lastTs='';
async function loadAll(){
  if(isLoading) return;
  isLoading=true;
  const btn=document.getElementById('reload-btn');
  btn.classList.add('loading');
  try{
    let lat,lon,pos=null;
    if(activeLoc.mode==='fixed'){
      lat=activeLoc.lat;lon=activeLoc.lon;
    }else{
      setBadge('Standort wird ermittelt…');
      pos=await getPosition();
      lat=pos?pos.lat:FALLBACK.lat;lon=pos?pos.lon:FALLBACK.lon;
    }
    setBadge('Wetterdaten werden geladen…');
    const [main,models,ens,place,warns,satSky,dav,brightSky]=await Promise.all([
      fetch(mainUrl(lat,lon)).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
      fetch(modelsUrl(lat,lon)).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(ensembleUrl(lat,lon)).then(r=>r.ok?r.json():null).catch(()=>null),
      (activeLoc.mode==='geo'&&pos)?fetchLocationName(lat,lon):Promise.resolve(null),
      fetchWarnings(lat,lon),
      sampleSatelliteSky(lat,lon),
      inDavRegion(lat,lon)?fetchDAV():Promise.resolve(null),
      isGermany(lat,lon)?fetch(brightSkyUrl(lat,lon)).then(r=>r.ok?r.json():null).catch(()=>null):Promise.resolve(null)
    ]);
    if(!main.current||!main.hourly||!main.daily) throw new Error('Unerwartetes Antwortformat');
    const data=buildWeatherData(main,models,buildEnsRain(ens),satSky,brightSky);
    data.dav=dav;
    if(warns&&warns.length){
      const top=warns.find(w=>w.severity==='danger')||warns[0];
      data.warning={title:top.title+(warns.length>1?` (+${warns.length-1} weitere)`:''),text:top.text,severity:top.severity};
    }
    const locName=activeLoc.mode==='fixed'
      ? activeLoc.name
      : (pos?((place&&place.name)||'Dein Standort'):FALLBACK.name);
    const elev=main.elevation!=null?`${Math.round(main.elevation)} m ü. NN`:'';
    const region=(place&&place.region)?place.region:'';
    const coords=`${lat.toFixed(3)}°N ${lon.toFixed(3)}°O`;
    const locSub=(activeLoc.mode==='geo'&&!pos)
      ? `${elev} · Kein Standortzugriff — zeige ${FALLBACK.name}`
      : [elev,region,coords].filter(Boolean).join(' · ');
    setLocation(locName,locSub);
    render(data);
    hasRendered=true;
    shownLoc={name:locName,lat,lon};
    radarSetCenter(lat,lon);
    fetchRadarFrames();
    updateFavBtn();
    renderCheckBadge(doubleCheck(data));
    lastTs=`${data.meta.ts} ${data.meta.ts_time}`;
    setBadge(`Live · ${data.meta.nModels>1?data.meta.nModels+' Modelle':'Open-Meteo'} · ${lastTs}`);
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({data,locName,locSub,loc:shownLoc}));}catch(e){}
  }catch(e){
    console.error('Wetter-Abruf fehlgeschlagen:',e);
    if(hasRendered){
      setBadge(`Stand ${lastTs||'unbekannt'} · Live-Update fehlgeschlagen`,true);
    }else{
      setLocation('offline','Keine Verbindung zur Wetter-API');
      showError(e.message||'Netzwerkfehler');
    }
  }finally{
    isLoading=false;
    btn.classList.remove('loading');
  }
}

// Start: zuletzt gespeicherte Daten sofort anzeigen, dann live aktualisieren
renderChips();
initFavDrag();
initRadar();
let cached=null;
try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');}catch(e){}
if(cached&&cached.data&&cached.data.meta){
  setLocation(cached.locName,cached.locSub);
  render(cached.data);
  hasRendered=true;
  shownLoc=cached.loc||null;
  updateFavBtn();
  lastTs=`${cached.data.meta.ts} ${cached.data.meta.ts_time}`;
  renderCheckBadge(doubleCheck(cached.data));
  setBadge(`Gespeichert · Stand ${lastTs}`,true);
}else{
  showLoading();
}
loadAll();

// Service Worker: App-Dateien offline vorhalten (nur über http/https, nicht bei file://)
// Übernimmt eine neue Version ein anderer Tab bereits aktiv gemachte Version,
// einmal neu laden — verhindert, dass eine alte Version stehen bleibt.
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  let swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(swReloaded)return;
    swReloaded=true;
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
